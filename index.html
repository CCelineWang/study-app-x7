/* 错题 → 跳转到真题卷原题（按全卷题号定位），返回时回到错题本 */
function idToQno(code,setName,type,idx){
  try{
    var exam=DATA[code]&&DATA[code].sets[setName];
    if(!exam) return 0;
    idx=parseInt(idx,10); if(isNaN(idx)) idx=0;
    if(exam.sections){
      var n=0;
      for(var i=0;i<exam.sections.length;i++){
        var sec=exam.sections[i];
        if(i===parseInt(String(type).replace('S',''),10)) return n+idx+1;
        n+=(sec&&sec.items)?sec.items.length:0;
      }
      return 0;
    }
    var order=['choice','multi','short','essay'];
    var acc=0;
    for(var j=0;j<order.length;j++){
      if(order[j]===type) return acc+idx+1;
      var t=exam[order[j]];
      if(t&&t.items) acc+=t.items.length;
    }
    return 0;
  }catch(e){ return 0; }
}
function wrongJumpOriginal(id){

  txt=txt.replace(/__(\d{1,3})__(\s*\(([^)]*)\))?/g,function(m,no,p2,stem){

    gr.items.forEach(function(it){ removeFromWrong(code+'::skillqs::'+k+'::'+gidx+'|'+it.no); });
    prog={};
  }
  fbProgSave(code,k,gr.name,prog);
  window.__cl.revealed=false;
  clozeRender(code,k,gidx);
}
function clozeTrans(code,k,gidx){
  var gr=skillQsGet(code,k).groups[gidx];
  var el=document.getElementById('cl-trans');
  if(!el) return;
  if(el.style.display==='none'||!el.style.display){ el.style.display='block'; el.innerHTML=(gr.zh?'📖 '+escHtml(gr.zh):'暂无译文'); }
  else { el.style.display='none'; }
}
function clozeExplain(code,k,gidx){
  var gr=skillQsGet(code,k).groups[gidx];
  var prog=fbProgGet(code,k,gr.name);
  var box=document.getElementById('cl-explain'); if(!box) return;
  if(!window.__cl.revealed){ box.innerHTML=''; return; }
  var h='';
  gr.items.forEach(function(it){
    var st=prog[String(it.no)];
    var tag=(st===undefined?'未作答':(st===it.a?'答对':'答错'));
    var tc=(st===undefined?'#999':(st===it.a?'#2d6a4f':'#9d2b2b'));
    h+='<div style="border:1px solid #e5e7eb;border-radius:8px;margin:6px 0;padding:10px 12px;background:#fff">'
      +'<div><b>'+it.no+'.</b> <span style="color:#b5482e;font-weight:700">答案：'+escHtml(it.a)+'</span>'+(it.stem?' <span style="color:#888;font-size:12px">（原词 '+escHtml(it.stem)+'）</span>':'')+' <span style="color:'+tc+';font-size:12px">['+tag+']</span></div>'
      +'<div style="font-size:13px;color:#555;line-height:1.7;margin-top:4px">'+escHtml(it.explain)+'</div></div>';
  });
  box.innerHTML=h;
}

zeInit();
updateWrongCount();
showHome();
</script>

<script>
window.flipVal=function(v){ if(typeof v==='string') return {lv:v,next:0}; if(v&&typeof v==='object'&&v.lv) return v; return {lv:'',next:0}; };
window.flipDue=function(v,now){ var o=flipVal(v); return !!o&&!!o.lv&&(!o.next||o.next<=now); };
window.showFlipCards=function(code,key,tab,dataArr){
  cleanupEngTranslate();
  document.body.classList.remove('eng-exam-mode');
  document.body.classList.remove('eng-word-mode');
  setActive('qa');

  var src=s.qa[key];
  if(!src&&s.sets&&s.sets[key]&&s.sets[key].short){ src=s.sets[key].short; }

  window.__fcData=dataArr||null;
  if(!items.length){ showQA(code); return; }
  document.getElementById('tb-crumb').textContent='首页 / '+s.name+' / '+key;
  document.getElementById('tb-title').textContent=s.name+' · '+key;
  var storeKey='zikao_flip_'+code+'_'+key;
  var state={};
  try{ state=JSON.parse(localStorage.getItem(storeKey)||'{}'); }catch(e){}
  var view=tab||'card';
  if(view==='review'){
    var now=Date.now();
    var dueIdx=items.map(function(_,i){ return i; }).filter(function(i){ return flipDue(state[i],now); });
    items=dueIdx.map(function(i){ return items[i]; });
    if(!items.length){
      document.getElementById('tb-crumb').textContent='首页 / '+s.name+' / '+key;
      document.getElementById('tb-title').textContent=s.name+' · '+key;

      return;
    }
  }
  var cur=0;
  if(window.__fcJumpIdx!=null&&window.__fcJumpIdx>=0&&window.__fcJumpIdx<items.length){ cur=window.__fcJumpIdx; window.__fcJumpIdx=null; }

    cur+=d;
    if(cur<0) cur=0;

  };
  var curTag=document.createElement('div');
  curTag.id='fc-root';
  document.getElementById('main-content').innerHTML='';
  document.getElementById('main-content').appendChild(curTag);
  function stateOf(i){ return flipVal(state[i]).lv||''; }
  function mark(i,lv){
    state[i]={lv:lv,next:Date.now()+(lv==='forget'?864e5:(lv==='fuzzy'?2*864e5:4*864e5))};
    try{ localStorage.setItem(storeKey,JSON.stringify(state)); }catch(e){}
    resumeSave(code,'fcflip',key,cur+1,items.length,key);
    try{ window.logStudy('card'); }catch(e){}
    try{ window.recordVisit(code,'fcflip',key); }catch(e){}
    try{ window.updateReviewCount(); }catch(e){}
    if(view==='review'){
      if(cur<items.length-1){ cur++; render(); }
      else {
        curTag.innerHTML='<div class="card" style="text-align:center;padding:28px 16px"><div style="font-size:22px">🎉</div><div style="font-size:16px;font-weight:700;margin:8px 0 4px">今日复习完成！</div><div style="font-size:13px;color:#888">本板块 '+items.length+' 张到期卡已全部复习，明天见。</div><div style="margin-top:14px"><span class="back2" onclick="backToSubject()">← 返回</span></div></div>';
      }
      return;
    }
    render();
  }
  window.__fcMark=mark;
  window.__fcState=stateOf;
  function stats(){
    var f=0,u=0,k=0;
    for(var i=0;i<items.length;i++){ var v=stateOf(i); if(v==='forget')f++; else if(v==='fuzzy')u++; else if(v==='know')k++; }
    return {f:f,u:u,k:k};
  }

    var html='<div class="fc-wrap">';

      html+='<div class="fc-prog" style="text-align:center;margin-bottom:2px">第 '+(cur+1)+' / '+items.length+' 张</div>';
      var it=items[cur];
      var q=(it.q||''); if(noMark){ q=q.replace(/。\s*$/,''); }
      q=escHtml(q).replace(/\n/g,'<br>');
      var a=it.a||'';
      html+='<div class="fc-card"><div class="fc-inner" id="fc-inner" onclick="document.getElementById(\'fc-inner\').classList.toggle(\'flip\')">';
      html+='<div class="fc-face fc-front"><div class="fc-q">'+q+'</div><div class="fc-hint">点击卡片查看答案</div></div>';
      html+='<div class="fc-face fc-back"><div class="fc-a">'+a+'</div></div>';
      html+='</div></div>';
      var lv=stateOf(cur);
      if(!noMark){ html+='<div class="fc-btns"><div class="fc-forget'+(lv==='forget'?'':'')+'" onclick="__fcMark('+cur+',\'forget\')">忘记了</div><div class="fc-fuzzy" onclick="__fcMark('+cur+',\'fuzzy\')">模糊</div><div class="fc-know" onclick="__fcMark('+cur+',\'know\')">记住了</div></div>'; }
      html+='<div class="fc-nav"><span id="fc-prev" class="'+(cur===0?'dis':'')+'" onclick="fcNavGo(-1)">← 上一张</span><span id="fc-next" class="'+(cur===items.length-1?'dis':'')+'" onclick="fcNavGo(1)">下一张 →</span></div>';
    } else {
      html+='<div class="fc-list">';
      var flatList=(key==='密押选择题考点100题');
      for(var i=0;i<items.length;i++){

        var lvCls = lv2==='know'?'st-know':(lv2==='fuzzy'?'st-fuzzy':(lv2==='forget'?'st-forget':''));
        if(flatList){
          var q2=(it2.q||''); if(noMark){ q2=q2.replace(/。\s*$/,''); }
          html+='<div class="fc-li open"><div class="fc-li-hd" style="cursor:default;justify-content:flex-start;column-gap:6px"><span class="fc-li-q">'+(i+1)+'. '+escHtml(q2).replace(/\n/g,'<br>')+'</span><span class="fc-li-a" style="display:inline;margin-top:0;color:#c0392b">'+(it2.a||'')+'</span></div>';
          html+='</div>';
        } else {
          html+='<div class="fc-li'+(lv2?'':'')+'"><div class="fc-li-hd" onclick="this.parentNode.classList.toggle(\'open\')"><span class="fc-li-q">'+(i+1)+'. '+escHtml(it2.q||'').replace(/\n/g,'<br>')+'</span><span class="fc-li-arrow">展开▾</span></div>';
          html+='<div class="fc-li-a">'+(it2.a||'')+'</div>';
          html+='<div class="fc-li-state">'+(lvCls?'<span class="'+lvCls+'">'+(lv2==='know'?'记住了':(lv2==='fuzzy'?'模糊':'忘记了'))+'</span>':'')+'<span class="st-forget" onclick="event.stopPropagation();__fcMark('+i+',\'forget\')">忘记</span><span class="st-fuzzy" onclick="event.stopPropagation();__fcMark('+i+',\'fuzzy\')">模糊</span><span class="st-know" onclick="event.stopPropagation();__fcMark('+i+',\'know\')">记住</span></div>';
          html+='</div>';
        }
      }
      html+='</div>';
    }
    html+='</div>';
    curTag.innerHTML=html;
    window.scrollTo(0,0);
  }
  render();
};
/* ===== 消消乐：问题↔答案 配对消除（卡片速记的第三个视图） ===== */
function ensureMatchCss(){

    +'</div>';
  window.__fmN=function(v){
    if(started){ var el=document.getElementById('fm-nv'); if(el) el.textContent=v+' 对（游戏中不可调）'; return; }

window.showSpeedRecall=function(code,k){
  cleanupEngTranslate();
  document.body.classList.remove('eng-exam-mode');
  document.body.classList.remove('eng-word-mode');
  var s=DATA[code];
  var set=s.sets[k];
  if(!set){ startQuiz(code,k); return; }
  var items=[];
  var LTRS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  ['choice','multi','short','essay'].forEach(function(type){
    var sec=set[type];
    if(!sec) return;
    (sec.items||[]).forEach(function(it){
      var q=it.q||'';
      var opts=(it.opts||[]).map(function(op,i){ return LTRS[i]+'. '+op; });
      var qFull=q+(opts.length? '\n\n'+opts.join('\n') : '');
      var a='';
      if(type==='choice'||type==='multi'){
        var ansStr=String(it.a==null?'':it.a);
        var idxs=[];

        a=idxs.filter(function(i){ return i>=0&&i<it.opts.length; }).map(function(i){ return LTRS[i]+'. '+it.opts[i]; }).join('\n');
      } else {
        a=it.a||'';
      }
      items.push({q:qFull, a:a});
    });
  });
  if(!items.length){ startQuiz(code,k); return; }
  showFlipCards(code,k,'card',items);

window.copyTxt=function(txt,btn){
  var done=function(){ if(btn){ var o=btn.textContent; btn.textContent='已复制 ✓'; setTimeout(function(){ btn.textContent=o; },1200); } };
  var toast=function(msg){
    try{
      var t=document.createElement('div');
      t.textContent=msg;
      t.style.cssText='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:400';
      document.body.appendChild(t);
      setTimeout(function(){ if(t.parentNode)t.parentNode.removeChild(t); },1600);
    }catch(e){}
  };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ done(); toast('已复制到剪贴板'); }).catch(function(){ fallbackCopy(txt,done,toast); });
    } else fallbackCopy(txt,done,toast);
  }catch(e){ fallbackCopy(txt,done,toast); }
};
function fallbackCopy(txt,done,toast){
  try{
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    var ok=document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok){ done(); toast('已复制到剪贴板'); }
    else toast('复制失败，请长按/选中文本手动复制');
  }catch(e){ toast('复制失败，请选中文本手动复制'); }
}

  showTplTable(code,k);
  setTimeout(function(){
    var rows=document.querySelectorAll('#main-content .tpl-row');
    var el=rows[n-1];

window.resumeJumpQA=function(code,type,key,mode,n){

  else { showZxMergedQA(code,type,key,'qaMerge'); }
  setTimeout(function(){
    var cards=document.querySelectorAll('#main-content .qa-card');
    var el=cards[n-1];
    if(el){
      var sc=el.closest('.qam-src-body');
      if(sc&&sc.style.display!=='block'){
        var hd=sc.parentNode.querySelector('.qam-src-head');
        if(hd) qamToggle(hd);
      }
      el.scrollIntoView({behavior:'smooth',block:'center'});
    }
  },120);
};
/* 合并库来源组折叠（手风琴：同时只展开一组） */
window.qamToggle=function(head){
  var all=document.querySelectorAll('#main-content .qam-src');
  for(var i=0;i<all.length;i++){
    var b=all[i].querySelector('.qam-src-body'); if(!b) continue;
    var a=all[i].querySelector('.qam-arrow');
    if(all[i]===head.parentNode){
      var open=b.style.display==='block';
      b.style.display=open?'none':'block';
      if(a) a.textContent=open?'展开 ▾':'收起 ▴';
    } else {
      b.style.display='none';
      if(a) a.textContent='展开 ▾';
    }
  }
};
/* 组导航来源标题 → 展开对应来源组并滚动到位（页面已渲染，无需重绘） */
window.zxQamGo=function(srcKey){
  var head=document.querySelector('#main-content .qam-src[data-src="'+srcKey+'"] .qam-src-head');
  if(!head) return;
  qamToggle(head);
  head.scrollIntoView({behavior:'smooth',block:'center'});
};
/* 选词填空「继续」：跳回上次填到的空位 */
window.resumeJumpFill=function(code,k,gidx,mod,no){

};
/* 作文素材卡片 / 关联词卡片「继续」跳转 */

/* 真题/卷类「继续」跳转 */
function resumeJumpQuiz(code,key,n){
  if(code==='15043'&&key==='高频选择题105题'){ showHi105(); setTimeout(function(){ if(window.__hi105Go) __hi105Go(Math.floor((n-1)/21)); },80); return; }
  if(code==='15044'&&key==='考前预测54题'){ showPred54(); setTimeout(function(){ try{ if(window.scrollToQ) scrollToQ(n-1); }catch(e){} },150); return; }
  startQuiz(code,key);
  setTimeout(function(){ try{ if(window.scrollToQ) scrollToQ(n-1); }catch(e){} },180);
}
/* 专项训练组内「继续」跳转 */
function resumeJumpZx(code,type,grKey,kind,n){
  window.__zxJump={idx:n-1};
  zxGo(code,type,grKey,kind);
}
/* 英语专项训练组内「继续」跳转 */
function resumeJumpSkill(code,k,grName,gidx,mod,n){

  setTimeout(function(){ try{ if(window.scrollToQ) scrollToQ(n-1); }catch(e){} },180);
}
/* 背单词「继续」跳转 */
function resumeJumpVocab(code,mode,n){
  showVocab(code,mode);
  setTimeout(function(){
    var st=window.__vState;
    if(st&&st.code===code&&st.type===(mode==='复习错词'?'review':'new')){
      st.idx=Math.max(0,Math.min(n-1,st.batch.length-1));
      var box=document.getElementById('vocab-card-box');
      if(box) box.innerHTML=vocabCardHtml(code,st.type);
    }
  },100);
}

<script>
try{ var __ld=document.getElementById('app-loading'); if(__ld&&__ld.parentNode) __ld.parentNode.removeChild(__ld); }catch(e){}
/* ===== 访问密码锁：买家激活码 / 管理密码，解锁后本机记住 ===== */
(function(){
  var acc=window.ZK_ACCESS||{};
  if(acc.enabled===false) return;
  if(localStorage.getItem('zk_ok')==='1') return;
  var cfgOk=(acc.codes&&acc.codes.length>0)||(acc.master&&acc.master!=='');
  var hint=cfgOk?'请输入激活码解锁使用':'系统配置异常，请联系管理员';
  var d=document.createElement('div');
  d.id='zk-lock';
  d.style.cssText='position:fixed;inset:0;z-index:100000;background:linear-gradient(160deg,#f7f8fa 0%,#eef1f5 100%);display:flex;align-items:center;justify-content:center;padding:16px';
  d.innerHTML=
    '<div style="background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.12);padding:34px 30px 28px;width:100%;max-width:360px;text-align:center;box-sizing:border-box">'+
    '<div style="font-size:22px;font-weight:800;color:#2b3a55;letter-spacing:1px">📚 自考刷题平台</div>'+
    '<div style="font-size:13px;color:#767676;margin:8px 0 22px">'+hint+'</div>'+
    '<input id="zk-pass" type="password" placeholder="激活码 / 管理密码" style="width:100%;padding:12px 14px;border:1px solid #dde2e8;border-radius:10px;font-size:15px;outline:none;box-sizing:border-box;text-align:center" />'+
    '<div id="zk-err" style="color:#c0392b;font-size:13px;min-height:18px;margin:8px 0 2px"></div>'+
    '<button onclick="ZK_unlock()" style="width:100%;padding:12px;background:#b5482e;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px">解锁</button>'+
    '<div style="font-size:11px;color:#bbb;margin-top:16px">解锁后本机自动记住，换设备需重新输入</div>'+
    '</div>';
  document.body.appendChild(d);
  window.ZK_unlock=function(){
    var p=(document.getElementById('zk-pass').value||'').trim();
    var a=window.ZK_ACCESS||{};
    var ok=(p===a.master)||((a.codes||[]).indexOf(p)>=0);
    if(ok){
      try{ localStorage.setItem('zk_ok','1'); }catch(e){}
      var m=document.getElementById('zk-lock'); if(m&&m.parentNode) m.parentNode.removeChild(m);
      return;
    }
    var er=document.getElementById('zk-err');
    if(er) er.textContent=(cfgOk?'激活码不正确，请核对后重试':'系统配置异常，请稍后再试');
  };
  var inp=document.getElementById('zk-pass');
  if(inp) inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ try{ window.ZK_unlock(); }catch(e){} } });
})();
try{
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
}catch(e){}
</script>
