<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自考专升本刷题 · 史纲/马原</title>
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f5f2ec; --card:#ffffff; --ink:#2b2b2b; --sub:#6b6b6b;
  --line:#e8e2d5; --brand:#3a5a40; --brand2:#588157;
  --accent:#b5482e; --accentbg:#fbeae6;
  --ok:#2d6a4f; --okbg:#e8f3ec; --bad:#9d2b2b; --badbg:#fbeaea;
  --hi:#fdf6e3; --leftbar:#b5482e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:96px}
:focus-visible{outline:2px solid #b5482e;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 80px}

/* 顶部 */
.topbar{background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.topbar-inner{max-width:820px;margin:0 auto;padding:0 16px;display:flex;justify-content:space-between;align-items:center}
.topbar h1{font-size:17px;font-weight:700}
.topbar .crumb{font-size:12px;color:var(--sub);margin-top:2px}
.topbar-actions{display:flex;gap:8px}
.mini-btn{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;color:var(--ink)}
.mini-btn.zedit-on{background:#b5482e;color:#fff;border-color:#b5482e}
.edit-mode [data-ze]{outline:1px dashed #b5482e;outline-offset:2px;cursor:pointer}
.edit-mode [data-ze]:hover{background:#fdf6f2}
.mini-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 首页 */
.subj-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.subj{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:24px 16px;text-align:center;cursor:pointer;transition:.15s}
.subj:hover{border-color:var(--brand);transform:translateY(-2px)}
.subj .code{font-size:12px;color:var(--sub);letter-spacing:1px}
.subj .name{font-size:17px;font-weight:700;margin-top:6px}
.subj .cnt{font-size:12px;color:var(--brand);margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.hint{font-size:13px;color:var(--sub);margin:4px 0}

.hidden{display:none!important}
/* 套题列表 */
.set-row{display:flex;justify-content:space-between;align-items:center;padding:16px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;background:var(--card)}
.set-row:hover{border-color:var(--brand)}
.set-row .t{font-weight:600}
.set-row .m{font-size:12px;color:var(--sub);margin-top:3px}
.set-row .go{color:var(--brand);font-size:13px;white-space:nowrap;margin-left:10px}
.back{font-size:14px;color:var(--brand);cursor:pointer;margin:8px 0;display:inline-block}

/* 大题分区标题 */
.section-head{background:var(--card);border-left:4px solid var(--leftbar);border-radius:0 10px 10px 0;padding:14px 18px;margin:22px 0 14px}
.section-head .st{font-size:16px;font-weight:700}
.section-head .sd{font-size:12.5px;color:var(--sub);margin-top:3px}

/* 题目卡片 */
.q-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.q-head{font-size:15px;margin-bottom:10px}
.q-head .qn{font-weight:700;font-size:16px}
.q-head .qscore{color:var(--sub);font-size:13px;margin-left:6px}
.q-text{font-size:15.5px;margin-bottom:14px;line-height:1.75}

/* 选项 */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.opt{display:flex;align-items:center;width:100%;text-align:left;padding:11px 14px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:15px;cursor:pointer;transition:.12s;font-family:inherit}
.opt .lab{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#f0ede5;font-weight:700;margin-right:12px;font-size:14px;flex-shrink:0}
.opt:hover{border-color:var(--brand2)}
.opt.correct{background:var(--okbg);border-color:var(--ok)}
.opt.correct .lab{background:var(--ok);color:#fff}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt.wrong .lab{background:var(--bad);color:#fff}
.opt.dim{opacity:.45}
.opt.selected{border-color:var(--brand);background:#eef3ee}
.opt:disabled{cursor:default}

/* 操作按钮 */
.q-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
.action-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#f7f4ec;font-size:13px;cursor:pointer;color:var(--ink)}
.action-btn:hover{background:#efe9da}
.fav-btn{border:0;background:transparent;cursor:pointer;font-size:22px;line-height:1;padding:4px 8px;color:#b9c0c9;transition:transform .12s;flex-shrink:0;border-radius:8px}
.fav-btn:hover{transform:scale(1.18);background:rgba(245,179,1,.08)}
.fav-btn[data-on="1"]{color:#f5b301}
.kp-btn{padding:8px 14px;border-radius:8px;border:1.5px solid #d8a24a;background:#fffaf0;font-size:13px;cursor:pointer;color:#8a5a1f;font-weight:600}
.kp-btn:hover{background:#fff3d9}
.kp-btn-head{margin:1px 0 1px 8px;padding:2px 10px;font-size:12px;flex:none;line-height:1.6}
.wrong-btn{padding:8px 16px;border-radius:8px;border:1px solid #f0cfc6;background:var(--accentbg);font-size:13px;cursor:pointer;color:var(--accent)}
.wrong-btn:hover{background:#f8ddd6}
.wrong-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 答案解析区 */
.ans-box{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.ans-box.show{display:block}
.ans-row{display:flex;gap:10px;margin-bottom:8px;font-size:14.5px;line-height:1.75}
.ans-tag{flex-shrink:0;min-width:42px;padding:1px 10px;border-radius:4px;font-size:12.5px;font-weight:700;text-align:center;height:24px;line-height:22px}
.tag-ans{background:var(--ok);color:#fff}
.tag-exp{background:var(--hi);color:var(--accent)}
.ans-row .av{flex:1}

/* 主观题作答提示 */
.self-note{font-size:12.5px;color:var(--sub);font-style:italic;margin-top:6px}
.ans-input{width:100%;min-height:150px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;margin:8px 0;background:#fff;line-height:1.6}
.ans-input:focus{outline:none;border-color:var(--brand2)}

/* 错题本空态 */
.empty{text-align:center;padding:40px 20px;color:var(--sub)}
.empty .big{font-size:40px;margin-bottom:10px}

/* 浮动进度 */
.toc{position:fixed;right:16px;bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:12.5px;box-shadow:0 2px 10px rgba(0,0,0,.08);z-index:15}
.toc b{color:var(--brand)}
/* 英语阅读：全文翻译按钮 + 气泡操作按钮 */
.section-head{position:relative}
.sec-trans-btn{position:absolute;right:0;top:2px;padding:3px 10px;border-radius:6px;border:1px solid #cfe0f2;background:#f5f9fd;color:#2b6cb0;font-size:11.5px;font-weight:600;cursor:pointer;z-index:2}
.sec-trans-btn:hover{background:#2b6cb0;color:#fff;border-color:#2b6cb0}
.wb-btn{padding:4px 11px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:12px;cursor:pointer;color:#444}
.wb-btn:hover{border-color:#b5482e;color:#b5482e}
@media(max-width:520px){.subj-grid{grid-template-columns:1fr}.toc{right:8px;bottom:8px}}

/* 侧边栏布局 */
.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:190px;min-width:190px;background:var(--card);border-right:1px solid var(--line);padding:10px 0;flex-shrink:0;overflow-y:auto;position:sticky;top:0;height:calc(100vh);align-self:flex-start}
.nav-item{padding:9px 16px;cursor:pointer;font-size:13px;color:var(--sub);border-left:3px solid transparent;transition:.12s;white-space:nowrap}
.nav-item:hover{background:rgba(0,0,0,.04);color:#222}
.nav-item.active{border-left-color:#4a9;padding-left:18px;font-weight:600;color:#377;background:rgba(0,0,0,.02)}
.nav-section{font-size:11px;color:#767676;padding:12px 16px 4px;letter-spacing:1px}
.main{flex:1;padding:18px;min-width:0}
.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.mod{border:1.5px solid var(--line);border-radius:14px;padding:22px 16px;cursor:pointer;transition:.15s;background:var(--card);text-align:center}
.mod:hover{border-color:#4a9;transform:translateY(-2px)}
.mod .icon{font-size:28px;margin-bottom:6px}
.mod .name{font-weight:700;font-size:15px}
.mod .cnt{font-size:12px;color:var(--sub);margin-top:4px}
.chap-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.chap-row:hover{border-color:#4a9}
.chap-row .t{font-weight:600}
.chap-row .m{font-size:12px;color:var(--sub);margin-top:2px}
.chap-row .go{color:#4a9;font-size:13px;white-space:nowrap;margin-left:10px}
.qa-card{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;background:var(--card)}
.qa-q{padding:13px 16px;font-weight:600;cursor:pointer}
.qa-q:hover{background:rgba(0,0,0,.03)}
.qa-a{padding:0 16px;max-height:0;overflow:hidden;transition:.25s;white-space:pre-wrap;line-height:1.7;background:#fafafa}
.qa-card.open .qa-a{padding:12px 16px;max-height:3000px;border-top:1px solid var(--line)}
.cv-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.cv-tab{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer;color:#444}
.cv-tab.on{background:#2d6a4f;color:#fff;border-color:#2d6a4f}
.cv-card{border:1px solid var(--line);border-radius:12px;padding:22px 20px;background:var(--card);min-height:150px;cursor:pointer;position:relative}
.cv-card:hover{border-color:#8ec5b0}
.cv-w{font-size:24px;font-weight:700;color:#1a1a1a}
.cv-pos{color:#b5482e;font-size:13px;margin-left:6px;font-weight:400}
.cv-def{font-size:16px;color:#333;margin-top:8px;line-height:1.7}
.cv-back{margin-top:12px;font-size:14px;color:#555;white-space:pre-wrap;line-height:1.8;border-top:1px dashed var(--line);padding-top:10px}
.cv-blank{display:inline-block;min-width:84px;border-bottom:2px solid #b5482e;text-align:center;margin:0 4px;vertical-align:middle}
.cv-dot{cursor:pointer;color:#b5482e;font-size:15px;line-height:1.4;display:inline-block;padding:0 8px}
.cv-bq{font-size:14.5px;line-height:2.1;margin:7px 0;color:#333}
.cv-bopts{display:none;flex-wrap:wrap;gap:8px;margin:4px 0 10px 24px}
.cv-bopt{padding:6px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;color:#333}
.cv-bopt:hover{background:#f7f7f7}
.cv-bopt.ok{background:#e6f4ec;color:#2d6a4f;font-weight:700;border-color:#2d6a4f}
.cv-bopt.no{background:#fdeaea;color:#9d2b2b}
.cv-bopt.ans{background:#fff7e6;color:#e8960c;font-weight:700}
.cv-done{color:#2d6a4f;font-weight:700;font-size:14px}
.cv-done.bad{color:#9d2b2b}
.cv-nav{display:flex;align-items:center;gap:10px;margin-top:14px}
.cv-btn{padding:7px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;color:#333}
.cv-btn:active{opacity:.7}
.cv-prog{color:#767676;font-size:13px;flex:1;text-align:center}
.cv-quiz{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--card);overflow:hidden}
.cv-quiz-q{padding:12px 16px;font-size:15px;line-height:1.8}
.cv-quiz-q b{color:#b5482e}
.cv-opt{display:block;width:100%;text-align:left;padding:9px 16px;border:none;background:#fff;border-top:1px solid #f0f0f0;cursor:pointer;font-size:14px;color:#333}
.cv-opt:hover{background:#f7f7f7}
.cv-opt.ok{background:#e6f4ec;color:#2d6a4f;font-weight:700}
.cv-opt.no{background:#fdeaea;color:#9d2b2b}
.cv-opt.ans{background:#fff7e6;color:#e8960c;font-weight:700}
.cv-hard{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--card);overflow:hidden}
.cv-hard-q{padding:13px 16px;font-size:15px;line-height:1.8;cursor:pointer;font-weight:600;color:#222}
.cv-hard-a{max-height:0;overflow:hidden;transition:.25s;background:#fafafa}
.cv-hard.open .cv-hard-a{max-height:2400px;padding:12px 16px;border-top:1px solid var(--line)}
.cv-zh{color:#2d6a4f;margin-bottom:8px;line-height:1.8}
.cv-ana{color:#555;font-size:14px;line-height:1.8}
.cv-gram{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--card);white-space:pre-wrap;line-height:1.9;font-size:14.5px;color:#333}
.back2{font-size:14px;color:#4a9;cursor:pointer;margin:4px 0 14px;display:inline-block;vertical-align:middle}

/* 答题卡吸顶栏 */
.answer-bar{position:sticky;top:0;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px 8px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.answer-bar .ab-title{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.answer-bar .ab-legend{display:flex;gap:12px;font-size:11px;color:var(--sub);align-items:center}
.answer-bar .ab-dots{display:flex;flex-wrap:wrap;gap:6px;max-height:110px;overflow-y:auto}
.ab-dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.12s;flex-shrink:0}
.ab-dot:hover{border-color:var(--brand2)}
.ab-dot.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.ab-dot.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.ab-dot.cur{border-color:#2b6cb0;box-shadow:0 0 0 2px rgba(43,108,176,.35);color:#2b6cb0;font-weight:800}
.ab-dot.cur.done,.ab-dot.cur.bad{color:#fff}
/* 专项训练组导航 chips：桌面换行，窄屏单行横向滑动 */
.zx-nav-chips{flex-wrap:wrap}
.zx-qflash{box-shadow:0 0 0 2px #b5482e !important;border-color:#b5482e !important;transition:box-shadow .2s}
@media(max-width:768px){.zx-nav-chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}.zx-nav-chips::-webkit-scrollbar{display:none}}
/* 英语真题左右分栏模式（仅 13000 真题启用） */

body.eng-exam-mode .main{padding:18px 22px;max-width:1400px}
body.eng-exam-mode .answer-bar{position:sticky;top:0;margin-left:0;z-index:30}
.blk{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;line-height:1.1}
.blk-num{font-size:11px;font-weight:800;color:#b5482e}
.blk-line{color:#b5482e;font-weight:700;letter-spacing:1px;border-bottom:1.5px solid #b5482e;padding:0 2px 1px;min-width:26px;text-align:center}
body.eng-exam-mode .opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
body.eng-exam-mode .opt{flex:0 1 auto;min-width:0;width:auto;margin-bottom:0;padding:9px 12px}
body.eng-exam-mode .q-text .qn{font-weight:700;font-size:16px;margin-right:6px}
body.eng-exam-mode .q-text .qscore{color:var(--sub);font-size:13px;margin-right:6px;font-weight:400}
.sec-wrap{display:block;margin-bottom:0;border:none;border-radius:0;padding:0;background:transparent}
.sec-left{max-width:none}
.sec-right{max-width:none}
.sec-left .sec-passage{max-height:none}
.sec-mark{color:#b5482e;font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;margin-right:2px;display:inline-block}
.ab-passage{background:#fbf8f2;border:1px solid var(--line);border-left:4px solid var(--leftbar);border-radius:0 8px 8px 0;padding:8px 12px;margin-top:8px;font-size:13px;line-height:1.6;color:#444;max-height:48vh;overflow-y:auto}
.ab-passage .abp-tag{display:inline-block;font-size:11px;color:var(--leftbar);font-weight:700;margin-bottom:2px}

<script>
/* 按需加载：离线词典(dict.js)与离线语音(mespeak*)不随首屏下载，首次点词/点发音时才注入，大幅提速首屏 */
function ZK_load(files, cb){
  if(!files||!files.length){ if(cb) cb(); return; }
  var i=0;
  function next(){
    if(i>=files.length){ if(cb) cb(); return; }
    var src=files[i++];
    if(document.querySelector('script[data-zk="'+src+'"]')){ next(); return; }
    var s=document.createElement('script');
    s.src=src;
    s.setAttribute('data-zk',src);
    s.onload=function(){ next(); };
    s.onerror=function(){ next(); };
    document.head.appendChild(s);
  }
  next();
}
</script>
<script>
/* ============ 全局搜索（跨四科：真题/问答/挖空/专项/预测） ============ */
var __gsTimer=null;
function gsOnFocus(){ var box=document.getElementById('gsearch-res'); var v=(document.getElementById('gsearch-input')||{}).value||''; if(v.trim()) box.style.display='block'; }
function gsClear(){ var inp=document.getElementById('gsearch-input'); if(inp) inp.value=''; var clr=document.getElementById('gsearch-clr'); if(clr) clr.style.display='none'; gsHide(); }
function gsHide(){ var box=document.getElementById('gsearch-res'); if(box) box.style.display='none'; }
function gsOnInput(v){
  clearTimeout(__gsTimer);
  v=(v||'').trim();
  var clr=document.getElementById('gsearch-clr');
  if(clr) clr.style.display=v?'':'none';
  if(!v){ gsHide(); return; }
  __gsTimer=setTimeout(function(){ gsRun(v); },180);
}
document.addEventListener('click',function(e){
  var w=document.getElementById('gsearch-wrap');
  if(w && !w.contains(e.target)) gsHide();
});
function gsRun(q){
  var box=document.getElementById('gsearch-res'); if(!box) return;
  var codes=['15043','15044','15040','13000'];
  var need=[];
  codes.forEach(function(c){ if(!(typeof DATA!=='undefined' && DATA[c])) need.push('data_'+c+'.js'); });
  if(need.length){
    box.innerHTML='<div class="gsearch-tip">正在加载全部科目数据，首次搜索稍慢…</div>';
    box.style.display='block';
    ZK_load(need,function(){ gsRun(q); });
    return;
  }
  var ql=String(q).toLowerCase();
  var res=[];
  function push(kind,code,grp,label,preview,k,idx){ res.push({kind:kind,code:code,grp:grp,label:label,preview:preview,k:k,idx:idx}); }
  codes.forEach(function(code){
    var s=DATA[code]; if(!s) return;
    var nm=s.name||code;
    /* 1. 真题卷题目（按渲染顺序计全卷题号，跳转才能精确定位） */
    Object.keys(s.sets||{}).forEach(function(setName){
      var set=s.sets[setName]; if(!set||typeof set!=='object') return;
      var qno=0;
      function walk(items,tname){
        (items||[]).forEach(function(it){
          qno++;
          var qq=String(it.q||''), ee=String(it.e||'');
          if(qq.indexOf(q)>=0||qq.toLowerCase().indexOf(ql)>=0||ee.indexOf(q)>=0){
            push('set',code,nm+' · 真题','['+setName+' · '+(tname==='choice'?'选择题':tname)+'] '+qq,qq.slice(0,80),setName,qno);
          }
        });
      }
      if(set.sections){ set.sections.forEach(function(sec){ walk(sec.items,sec.type); }); }
      else { ['choice','multi','short','essay'].forEach(function(type){ var t=set[type]; if(t&&t.items) walk(t.items,type); }); }
    });
    /* 2. 问答库 */
    Object.keys(s.qa||{}).forEach(function(k){
      var g=s.qa[k]; if(!g) return;
      var items=g.items||g.list||[];
      if(typeof items==='string') items=[items];
      if(!Array.isArray(items)) items=[];
      items.forEach(function(it,idx){
        var qq=(typeof it==='string')?it:String(it.q||'');
        var aa=(typeof it==='string')?'':String(it.a||'');
        if((qq+aa).indexOf(q)>=0){
          push('qa',code,nm+' · 问答',k+'｜'+(qq.slice(0,50)),qq.slice(0,80),k,idx);
        }
      });
    });
    /* 3. 挖空/原文 */
    Object.keys(s.blanks||{}).forEach(function(k){
      var v=s.blanks[k]; if(!v) return;
      if(v.type==='raw'){
        var txt=String(v.content||'');
        if(txt.indexOf(q)>=0) push('raw',code,nm+' · 原文','【'+k+'】 '+txt.slice(0,60),txt.slice(0,80),k,-1);
      } else if(Array.isArray(v)){
        v.forEach(function(it,idx){
          var qq=(typeof it==='string')?it:String(it.q||it.t||it.name||it.y||'');
          if(qq&&qq.indexOf(q)>=0) push('blank',code,nm+' · 挖空',k+'｜'+qq.slice(0,50),qq.slice(0,80),k,idx);
        });
      }
    });
    /* 4. 英语专项 skillQs */
    var sq=s.skillQs;
    if(sq&&typeof sq==='object'){
      Object.keys(sq).forEach(function(k){
        var g0=sq[k]; if(!g0||!g0.groups) return;
        g0.groups.forEach(function(g){
          (g.items||[]).forEach(function(it){
            var qq=(typeof it==='string')?it:String(it.q||it.title_en||it.name||'');
            var aa=(typeof it==='string')?'':String(it.a||'');
            if(qq.indexOf(q)>=0||aa.indexOf(q)>=0||String(qq).toLowerCase().indexOf(ql)>=0){
              push('skillqs',code,nm+' · 专项',k+'｜'+(qq.slice(0,50)),qq.slice(0,80),k,-1);
            }
          });
        });
      });
    }
    /* 5. 真题预测主题 */
    var P=(typeof PRED!=='undefined')?PRED[code]:null;
    if(P&&P.groups){
      P.groups.forEach(function(g){
        (g.items||[]).forEach(function(it){
          var tp=it.topic||'', rs=it.reason||'';
          if(tp.indexOf(q)>=0||rs.indexOf(q)>=0){
            push('pred',code,nm+' · 真题预测','【'+g.title+'】 '+tp,tp.slice(0,80),'',-1);
          }
        });
      });
    }
  });
  var LIMIT=30;
  var total=res.length;
  if(!total){ box.innerHTML='<div class="gsearch-tip">未找到与「'+escHtml(q)+'」相关的内容</div>'; box.style.display='block'; return; }
  var html='<div class="gsearch-tip" style="padding-bottom:6px">找到 '+total+' 条相关结果（点击跳转）</div>';
  var shown=0, curGrp='';
  res.forEach(function(r){
    if(shown>=LIMIT) return;
    if(r.grp!==curGrp){ curGrp=r.grp; html+='<div class="gsearch-grp">'+escHtml(r.grp)+'</div>'; }
    html+='<div class="gsearch-row" onclick="gsJump('+JSON.stringify(r).replace(/"/g,'&quot;')+')">'
      +'<span class="gs-tag">'+({set:'真题',qa:'问答',raw:'原文',blank:'挖空',skillqs:'专项',pred:'预测'}[r.kind]||r.kind)+'</span>'
      +'<div style="flex:1;min-width:0"><div class="gs-lbl">'+escHtml(r.label)+'</div><div class="gs-pv">'+escHtml(r.preview)+'</div></div>'
      +'<span style="color:#b5482e;font-size:12px;flex:none">去 →</span>'
      +'</div>';
    shown++;
  });
  if(total>LIMIT) html+='<div class="gsearch-more">还有 '+(total-LIMIT)+' 条匹配，请换更精确的关键词</div>';
  box.innerHTML=html;
  box.style.display='block';
}
function gsJump(r){
  gsHide();
  var inp=document.getElementById('gsearch-input'); if(inp) inp.blur();
  var c=r.code;
  if(!(typeof DATA!=='undefined' && DATA[c])){
    ZK_showLoading(true);
    ZK_load(['data_'+c+'.js'],function(){ ZK_showLoading(false); gsJump(r); });
    return;
  }
  if(curSubj!==c){ try{ goSubject(c); }catch(e){} }
  if(r.kind==='set'){ navGo(c,'sets',r.k); setTimeout(function(){ try{ gsScrollToQno(r.idx); }catch(e){} },650); }
  else if(r.kind==='qa'){ navGo(c,'qa',r.k); }
  else if(r.kind==='raw'){ showRawBlanks(c,r.k); }
  else if(r.kind==='blank'){ navGo(c,'blanks',r.k); }
  else if(r.kind==='skillqs'){ navGo(c,'skillreading',r.k); }
  else if(r.kind==='pred'){ showPred(c); }
}
function gsScrollToQno(qno){
  var el=document.querySelector('#main-content .q-card[data-qno="'+qno+'"]');
  if(!el) return;
  var barEl=document.getElementById('answer-bar');
  var barH=barEl?barEl.offsetHeight:0;
  var y=el.getBoundingClientRect().top+window.scrollY-(barH+20);
  if(abNavLock&&window.__abUnlock){ try{ window.__abUnlock(); }catch(e){} }
  window.scrollTo(0,Math.max(0,y));
  // 目标题黄色闪烁，帮助快速定位
  el.classList.remove('gs-flash');

  el.classList.add('gs-flash');
  setTimeout(function(){ el.classList.remove('gs-flash'); },3000);
  // 同步答题卡高亮
  if(abState&&abState.ques&&abState.ques.length){
    var target=abState.ques.length-1;
    abState.ques.forEach(function(q,i){ if(q&&q.qnoNum===qno) target=i; });
    if(abState.curIdx!==target){ abState.curIdx=target; try{ updateAnswerBar(); }catch(e){} }
  }
}

function colorPoints(text){
  // 把①②③④⑤⑥⑦⑧⑨⑩ 标红
  text = text.replace(/([①②③④⑤⑥⑦⑧⑨⑩])/g, '<span style="color:#b5482e;font-weight:700">$1</span>');
  // 把第一、第二、第三... 标红
  text = text.replace(/(第[一二三四五六七八九十]+[、，,．.])/g, '<span style="color:#b5482e;font-weight:700">$1</span>');
  // (1)(2)(3) 与 （1）（2）（3） 标红
  text = text.replace(/([（(]\d+[）)])/g, '<span style="color:#b5482e;font-weight:700">$1</span>');
  // （一）（二）（三） 标红
  text = text.replace(/([（(][一二三四五六七八九十]+[）)])/g, '<span style="color:#b5482e;font-weight:700">$1</span>');
  // 句首 一、二、三、 标红
  text = text.replace(/^[一二三四五六七八九十]+[、，]/gm, '<span style="color:#b5482e;font-weight:700">$&</span>');
  // 首先、其次、再次、最后 标红
  text = text.replace(/(首先|其次|再次|最后)[，,]/g, '<span style="color:#b5482e;font-weight:700">$&</span>');
  return text;
}
// 真题简答/论述答案：把并列结构（圈码/编号/序数/分号分隔的并列块）分行，直观呈现
function splitPointsZh(text){
  text = String(text||'');
  // 合并 PDF 提取的句中硬换行：换行前非标点、换行后非序号开头 → 并成一行（避免"中\n国""条\n件"这类断行；序号如"（3）\n传播"也合并）
  text = text.replace(/([^。；;：:，,、])\n(?!\n)(?![①②③④⑤⑥⑦⑧⑨⑩（(])\s*/g, '$1');
  // 顿号/逗号后的硬换行（PDF 行尾断行）也合并，序号开头的换行保留
  text = text.replace(/([，,、])\n(?!\n)(?![①②③④⑤⑥⑦⑧⑨⑩（(])\s*/g, '$1');
  // ②③④⑤⑥⑦⑧⑨⑩ 每个前换行
  text = text.replace(/([②③④⑤⑥⑦⑧⑨⑩])/g, '\n$1');
  // ① 前面有内容时换行
  text = text.replace(/([^\n])(①)/g, '$1\n$2');
  // （2）（3）... / （一）（二）...：前面有内容时换行（（1）（一）在句首不重复换行）
  text = text.replace(/([^\n])([（(](?:\d+|[一二三四五六七八九十]+)[）)])/g, '$1\n$2');
  // 句首或句号/分号后的 第X[，、] / 第X种 换行
  text = text.replace(/(^|[。；;])\s*(第[一二三四五六七八九十]+(?:[，、]|种))/g, '$1\n$2');
  // 句首或句号/分号后的 数字+、 换行
  text = text.replace(/(^|[。；;])\s*(\d+[、])/g, '$1\n$2');
  // 句首或句号/分号后的 首先/其次/再次/最后[，,] 换行
  text = text.replace(/(^|[。；;])\s*(首先|其次|再次|最后)[，,]/g, '$1\n$2，');
  // 逗号+坚持 列举短语分行（高频并列模式：坚持A，坚持B，坚持C）
  text = text.replace(/，坚持/g, '，\n坚持');
  // 无圈码的（n）块：标签词后冒号换行，分号分段自动加①②③；若分号后只有一段则不编号、不分行（如"（1）改革官制：整顿吏治；"保持一行）
  text = text.replace(/[（(](\d+)[）)]([^\n，,：:]{1,10})[，,：:]([^\n]*?(?:[^\n]*；[^\n]*)+)(?=\n|$)/g, function(m, n, label, body){
    if (/[①②③④⑤⑥⑦⑧⑨⑩]/.test(m)) return m;
    var segs = body.split('；');
    var circ = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
    var list = [];
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i].replace(/^\s+|\s+$/g, '');
      if (s) list.push(s);
    }
    if (list.length < 2) return m.replace(/^((?:[（(]\d+[）)])[^，,：:]{1,10})[，,]/, '$1：');
    var out = '（' + n + '）' + label + '：\n';
    for (var j = 0; j < list.length; j++) {
      out += (circ[j] || ((j + 1) + '.')) + list[j] + (j < list.length - 1 ? '；\n' : '');
    }
    return out.replace(/\s+$/, '');
  });
  // 分号后换行（并列块分隔）
  text = text.replace(/；/g, '；\n');
  // 清理多余空行
  text = text.replace(/\n{2,}/g, '\n').replace(/^\n+/, '');
  return text;
}
function colorPointsQA(text){
  // 英语背诵/笔记答案增强：在 colorPoints 基础上，识别二级标题行（如"1. 职场类★★★★★"）标红加粗
  text = text.replace(/^(\d+\.\s*[\u4e00-\u9fa5]{2,12}(?:类|部分|主题|话题|题型|模板|框架|场景|篇|章|节|题|要点)[^\n]{0,24})$/gm, '<span style="color:#b5482e;font-weight:700">$1</span>');

}
function multiToggle(btn, id){

function judgeMulti(btn, id){

  if(right) removeFromWrong(id); else addToWrong(id);

function findItem(id){
  const parts=id.split('|');
  const subj=parts[0],set=parts[1],type=parts[2],i=parts[3];

  if(s.sections){ const sec=s.sections[parseInt(type.replace('S',''))]; return {item:sec.items[parseInt(i)],type:sec.type}; }
  return {item:s[type].items[parseInt(i)],type:type};
}
function revealChoice(btn,id){
  const card=btn.closest('.q-card');
  const {item}=findItem(id);
  const picked=answers[id];
  const optsWrap=card.querySelector('.opts');
  optsWrap.querySelectorAll('.opt').forEach((ob,oi)=>{
    ob.disabled=true;
    ob.classList.remove('selected');
    if(oi===item.a)ob.classList.add('correct');
    if(oi===picked&&picked!==item.a)ob.classList.add('wrong');
    if(oi!==item.a&&oi!==picked)ob.classList.add('dim');
  });
  const ab=card.querySelector('.ans-box');
  let mark='<b>'+'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[item.a]+'</b>';

    <div class="ans-row"><span class="ans-tag tag-exp">解析</span><span class="av">${item.e}</span></div>`;
  ab.classList.add('show');
  if(picked!==item.a) addToWrong(id); else removeFromWrong(id);
  btn.textContent='收起答案与解析';
  btn.onclick=()=>{ ab.classList.remove('show'); btn.textContent='显示答案与解析'; btn.onclick=()=>revealChoice(btn,id); };
}

function initSbDivider(){
  var layout=document.querySelector('.layout');
  var sb=document.getElementById('sidebar');
  if(!layout||!sb) return;
  var div=document.getElementById('sb-divider');
  if(!div){
    div=document.createElement('div');
    div.id='sb-divider';
    div.className='sb-divider';
    sb.parentNode.insertBefore(div, sb.nextSibling);
  }
  var saved=parseInt(window.localStorage.getItem('zikao_sbw')||'0',10);
  if(saved>=130&&saved<=360){ sb.style.width=saved+'px'; }
  var dragging=false;
  div.onmousedown=function(e){
    e.preventDefault();
    dragging=true;
    div.classList.add('dragging');
    document.body.style.cursor='col-resize';
    document.body.style.userSelect='none';
  };
  document.onmousemove=function(e){
    if(!dragging) return;
    var rect=layout.getBoundingClientRect();
    var w=Math.round(e.clientX-rect.left);
    if(w<130) w=130;
    if(w>360) w=360;
    sb.style.width=w+'px';
  };
  document.onmouseup=function(){
    if(!dragging) return;
    dragging=false;
    div.classList.remove('dragging');
    document.body.style.cursor='';
    document.body.style.userSelect='';
    var w=parseInt(sb.style.width||'190',10);
    try{ window.localStorage.setItem('zikao_sbw', String(w)); }catch(_){}
  };
}

function tlPeriod(y){
  var m=String(y).match(/(\d{4})/);
  if(!m){ if(String(y).indexOf('19世纪')>=0) return '旧'; return 'all'; }
  var yr=+m[1];
  if(yr>=1840&&yr<=1918) return '旧';
  if(yr>=1919&&yr<=1949) return '新';
  if(yr>=1949) return '后';
  return 'all';
}

var ZP_KEY='zikao_patch_v1';
function ZP_load(){ try{ var d=JSON.parse(localStorage.getItem(ZP_KEY)||'[]'); if(Array.isArray(d)) return d; }catch(e){} return []; }
function ZP_save(a){ try{ localStorage.setItem(ZP_KEY,JSON.stringify(a)); }catch(e){ alert('保存失败：'+e.message); } }
function ZP_get(code,sec,key,loc,field,partIdx){
  var a=ZP_load();
  for(var i=0;i<a.length;i++){
    var p=a[i];
    if(p.code===code&&p.sec===sec&&p.key===key&&String(p.loc)===String(loc)&&p.field===field){
      if(partIdx==null){ if(p.partIdx==null) return p.val; }
      else { if(String(p.partIdx)===String(partIdx)) return p.val; }
    }
  }
  return undefined;
}
function ZP_set(code,sec,key,loc,field,partIdx,val){
  ZP_undoPush();
  var a=ZP_load();
  for(var i=0;i<a.length;i++){
    var p=a[i];
    if(p.code===code&&p.sec===sec&&p.key===key&&String(p.loc)===String(loc)&&p.field===field){
      if(partIdx==null){ if(p.partIdx==null){ p.val=val; ZP_save(a); return; } }
      else { if(String(p.partIdx)===String(partIdx)){ p.val=val; ZP_save(a); return; } }
    }
  }
  var np={code:code,sec:sec,key:key,loc:String(loc),field:field};
  if(partIdx!=null) np.partIdx=partIdx;
  np.val=val;
  a.push(np);
  ZP_save(a);
}
function ZP_or(v,def){ return v===undefined?def:v; }
function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* 挖空条目：parts ↔ 全文（【答案】标记） */
function partsToFull(item){
  return (item.parts||[]).map(function(p){ return (p.t||'')+(p.g!==undefined?'【'+p.g+'】':''); }).join('');
}
function parseFull(s){
  var np=[], re=/【([^】]*)】/g, last=0, m;
  while((m=re.exec(s))!==null){
    if(m.index>last) np.push({t:s.substring(last,m.index)});
    np.push({g:m[1]});
    last=m.index+m[0].length;
  }
  if(last<s.length) np.push({t:s.substring(last)});
  if(np.length===0) np.push({t:s});
  return np;
}

/* 行级挖空：在浏览态选中条目内文字 → 原地变刮刮乐遮挡（不重绘不刷新），数据同步写入补丁 */
function ZP_blankFromSel(code,sec,key,loc,boxEl){
  if(!boxEl) return;
  var sel=getSelection();
  if(!sel||sel.rangeCount<1){ ZP_hint('请先选中本条目的文字，再点挖空'); return; }
  var inside=false,node=sel.anchorNode;
  while(node&&node!==document){ if(node===boxEl){ inside=true; break; } node=node.parentNode; }
  if(!inside){ ZP_hint('请先选中本条目的文字，再点挖空'); return; }
  /* 先检测选中的是否在刮刮乐涂层内（涂层文字不可选，toString 为空，需先判断） */
  var sp=null,n2=sel.anchorNode;
  while(n2&&n2!==boxEl){ if(n2.classList&&n2.classList.contains('scratch')){ sp=n2; break; } n2=n2.parentNode; }
  var txt=sel.toString();
  if(sp){
    /* 选中涂层 → 取消挖空：涂层原地恢复普通文字 */
    var t=sp.textContent;
    sp.classList.remove('scratch'); sp.onclick=null;
    var full=ZP_rebuildMarked(boxEl);
    var nv=full.replace('【'+t+'】',t);
    ZP_set(code,sec,key,loc,'full',null,nv);
    ZP_selClear();
    sel.removeAllRanges();
    return;
  }
  if(!txt||!txt.trim()){ ZP_hint('请先选中本条目的文字，再点挖空'); return; }
  /* 挖空：range 内文字 → 原地替换为刮刮乐涂层 */
  var full2=ZP_rebuildMarked(boxEl);
  var range=sel.getRangeAt(0);
  var np=document.createElement('span');
  np.className='scratch';
  np.textContent=txt;
  np.onclick=function(ev){ ev.stopPropagation(); this.classList.toggle('revealed'); };
  range.deleteContents();
  range.insertNode(np);
  ZP_set(code,sec,key,loc,'full',null,full2.replace(txt,'【'+txt+'】'));
  ZP_selClear();
  sel.removeAllRanges();
}

/* 取条目「带挖空标记」的完整文本：scratch 涂层 → 【答案】，操作栏排除 */
function ZP_rebuildMarked(root){
  var out='';
  function walk(node){
    if(node.nodeType===3){ out+=node.data; return; }
    if(node.nodeType!==1) return;
    if(node.classList){
      if(node.classList.contains('zp-bar')) return;
      if(node.classList.contains('scratch')){ out+='【'+node.textContent+'】'; return; }
    }
    for(var i=0;i<node.childNodes.length;i++) walk(node.childNodes[i]);
  }
  walk(root);
  return out;
}
function ZP_inlineEdit(code,sec,key,loc,el){
  if(zeditState) ZP_inlineDone();
  var box=ZP_box(el);
  var root=box.el;
  var bar=root.querySelector('.zp-bar');
  if(bar) bar.style.display='none'; /* 编辑期间隐藏操作栏，避免其文字混入内容 */
  var els=[];
  if(root.getAttribute('data-ze')) els.push(root);
  [].forEach.call(root.querySelectorAll('[data-ze]'),function(x){ els.push(x); });
  var infos=[];
  els.forEach(function(x){
    var ze=x.getAttribute('data-ze').split('|');
    if(ze.length<5) return;
    var f=ze[4];
    if(sec==='set'&&f==='a') return; /* 选择题答案只读 */
    if(x.getAttribute('contenteditable')) return;
    x.setAttribute('contenteditable','true');
    x.style.outline='2px dashed #2e86c1';
    x.style.outlineOffset='1px';
    x.style.borderRadius='4px';
    x.style.cursor='text';
    infos.push({el:x,code:ze[0],sec:ze[1],key:ze[2],loc:ze[3],field:f,pi:ze[5]||'',start:ZP_rebuildMarked(x)});
  });
  if(infos.length===0){ alert('该条目无可编辑的文字'); return; }
  zeditState={els:infos,bar:bar};
  window.__zpInline=zeditState;
  var f0=infos[0].el;
  try{
    f0.focus();
    var r=document.createRange(); r.selectNodeContents(f0); r.collapse(false);
    var s=getSelection(); s.removeAllRanges(); s.addRange(r);

function ZP_inlineBlank(){
  if(!zeditState) return;

  }

  if(st.length&&st[st.length-1]===s) return;

  if(st.length>10) st.shift();
  localStorage.setItem(ZP_UNDO_KEY,JSON.stringify(st));

/* 拆分条目（qa：题目不变，答案拆分；blank：全文拆分） */
function ZP_splitDlg(code,sec,key,loc){
  var body=document.createElement('div'),t1,t2;
  if(sec==='blank'){
    var cur=ZP_curFull(code,sec,key,loc);
    t1=ZP_ta('保留在原条目的内容',''); t1.ta.value=cur;
    t2=ZP_ta('拆分到新条目（自动插到本条目后面）','');
  } else {
    var elQ=ZP_findEl(code,sec,key,loc);
    var qv=elQ?elQ.getAttribute('data-cur')||'':'';
    var qWrap=ZP_ta('题目（保留）',qv);
    t1=ZP_ta('答案 · 保留在原条目的前半','');
    t2=ZP_ta('答案 · 拆分到新条目的后半','');
    body.appendChild(qWrap.wrap);
    // 取当前答案
    var card=ZP_box(elQ);
    var qaA=card.el.querySelector('.qa-a');
    if(qaA) t1.ta.value=qaA.getAttribute('data-cur')||'';
  }
  body.appendChild(t1.wrap); body.appendChild(t2.wrap);
  ZP_dlg('拆分条目',body,function(){
    var a1=t1.ta.value,a2=t2.ta.value;
    if(!a2){ alert('新条目的内容为空'); return false; }
    if(sec==='blank'){
      ZP_set(code,sec,key,loc,'full',null,a1);
      var insId='ins'+(++ZP_INS_SEQ);
      ZP_setOp(code,sec,key,insId,'ins',{after:loc,item:{q:'',a:a2}});
    } else {
      var card2=ZP_box(ZP_findEl(code,sec,key,loc));
      var qA=card2.el.querySelector('.qa-q');
      var qv2=qA?qA.getAttribute('data-cur')||'':'';
      var elA2=card2.el.querySelector('.qa-a');
      if(elA2) ZP_set(code,sec,key,loc,'a',null,a1);
      var insId2='ins'+(++ZP_INS_SEQ);
      ZP_setOp(code,sec,key,insId2,'ins',{after:loc,item:{q:qv2,a:a2}});
    }
    ZP_applyAll();
  });
}
/* 合并条目（与本条目下一条合并） */
function ZP_mergeDlg(code,sec,key,loc){
  var el=ZP_findEl(code,sec,key,loc); if(!el){ alert('未找到该条目'); return; }
  var box=ZP_box(el);
  var next=ZP_nextBox(box);
  if(!next){ alert('这已是最后一条，没有可合并的下一条'); return; }
  var nextLoc=ZP_locOf(next);
  if(!nextLoc){ alert('无法定位下一条'); return; }
  var body=document.createElement('div');
  var info=document.createElement('div');
  info.style.cssText='font-size:12.5px;color:#888;margin-bottom:4px';
  if(sec==='blank'){
    var c1=ZP_curFull(code,sec,key,loc),c2=ZP_curFull(code,sec,key,nextLoc);
    info.textContent='合并后（两条内容拼接为一条，原下一条将被删除）：';
    var t=ZP_ta('合并后的完整内容',(c1+' ').replace(/\s+$/,'')+'\n'+c2);
    body.appendChild(info); body.appendChild(t.wrap);
    ZP_dlg('合并条目',body,function(){
      if(!t.ta.value.trim()){ alert('合并后内容不能为空'); return false; }
      ZP_set(code,sec,key,loc,'full',null,t.ta.value);
      ZP_setOp(code,sec,key,nextLoc,'del',true);
      ZP_applyAll();
    });
  } else {
    var cq1=box.el.querySelector('.qa-q'),ca1=box.el.querySelector('.qa-a');
    var cq2=next.el.querySelector('.qa-q'),ca2=next.el.querySelector('.qa-a');
    var q1=cq1?cq1.getAttribute('data-cur')||'':'',a1=ca1?ca1.getAttribute('data-cur')||'':'';
    var q2=cq2?cq2.getAttribute('data-cur')||'':'',a2=ca2?ca2.getAttribute('data-cur')||'':'';
    info.textContent='合并后（答案拼接，题目保留第一条；原下一条将被删除）：';
    var qT=ZP_ta('题目（保留）',q1);
    var aT=ZP_ta('合并后的答案',(a1+(a1&&a2?'\n':'')+a2));
    body.appendChild(info); body.appendChild(qT.wrap); body.appendChild(aT.wrap);
    ZP_dlg('合并条目',body,function(){
      ZP_set(code,sec,key,loc,'q',null,qT.ta.value);
      ZP_set(code,sec,key,loc,'a',null,aT.ta.value);
      ZP_setOp(code,sec,key,nextLoc,'del',true);
      ZP_applyAll();
    });
  }
}

/* MutationObserver 自动应用补丁 */
function ZP_hook(){
  var mc=document.getElementById('main-content');
  if(!mc||mc.getAttribute('data-zp-hooked')) return;
  mc.setAttribute('data-zp-hooked','1');
  new MutationObserver(function(){
    if(window.__zpBusy) return;
    window.__zpBusy=true;
    setTimeout(function(){ try{ ZP_applyAll(); }finally{ window.__zpBusy=false; } },40);
  }).observe(mc,{childList:true,subtree:true});
  ZP_applyAll();
}

function showTplTable(code,k){
  setActive('template');
  const s=DATA[code];
  const g=s.qa[k];
  if(!g){ document.getElementById('main-content').innerHTML='<div style="color:#767676;padding:20px">暂无资料</div>'; return; }
  document.getElementById('tb-crumb').textContent='首页 / '+s.name+' / 万能答题模板';
  document.getElementById('tb-title').textContent=s.name+' · 万能答题模板';
  let html='<span class="back2" onclick="showOverview(\''+code+'\')">← 返回</span>';
  html+=resumeBar(code,'tpl',k,"resumeJumpTpl('"+code+"','"+k+"',__N__)",'万能答题模板');
  html+='<div style="font-size:17px;font-weight:700;margin:4px 0 8px">万能答题模板（'+(g.items||[]).length+'条）</div>';
  function tplHoles(txt, holes){
    var out=escHtml(txt||'').replace(/\n/g,'<br>');
    (holes||[]).forEach(function(h){
      if(!h) return;
      var tag='<span class="scratch">'+escHtml(h)+'</span>';
      out=out.split(escHtml(h)).join(tag);
    });
    return out;
  }
  // 分组：header / 独立卡片（第一部分）/ 同主题合并（第二部分）
  var groups=[];
  (g.items||[]).forEach(function(it,idx){
    var zh=ZP_get(code,'qa',k,idx,'q',null);
    var za=ZP_get(code,'qa',k,idx,'a',null);
    var qv=zh!==undefined?zh:(it.q||'');
    var av=za!==undefined?za:(it.a||'');
    if(!qv&&!av&&it.header){ groups.push({header:it.header}); return; }
    var mT=qv.match(/【(主题\d+：[^】]+)】/);
    if(mT){
      var theme=mT[1];
      var qbody=qv.slice(qv.indexOf('】')+1);
      var last=groups[groups.length-1];
      if(last&&!last.header&&last.theme===theme){ last.items.push({idx:idx,kw:it.keyword||'',qbody:qbody,av:av,holes:it.holes||[]}); }
      else groups.push({theme:theme,items:[{idx:idx,kw:it.keyword||'',qbody:qbody,av:av,holes:it.holes||[]}]});
    } else {
      var qbody=/^\d+\./.test(qv)?'':qv;
      groups.push({theme:qv,kw:it.keyword||'',single:{idx:idx,qbody:qbody,av:av,holes:it.holes||[]}});
    }
  });
  groups.forEach(function(gr){
    if(gr.header){
      html+='<div class="qa-sec" style="font-size:15px;font-weight:700;color:#b5482e;margin:16px 0 6px;border-left:3px solid #b5482e;padding-left:8px">'+escHtml(gr.header)+'</div>';
      return;
    }
    if(gr.single){
      var b='';
      if(gr.single.qbody) b+='<div class="tpl-q">'+escHtml(gr.single.qbody)+'</div>';
      b+='<div class="tpl-ans">'+tplHoles(gr.single.av,gr.single.holes)+'</div>';
      html+='<div class="tpl-row" onclick="tplOpen(this)"><div class="tpl-theme" data-ze="'+code+'|qa|'+k+'|'+gr.single.idx+'|q" data-cur="'+escAttr(gr.theme)+'">'+escHtml(gr.theme)+'</div>'+(gr.kw?'<div class="tpl-kw">'+escHtml(gr.kw)+'</div>':'')+'<div class="tpl-body" data-ze="'+code+'|qa|'+k+'|'+gr.single.idx+'|a" data-cur="'+escAttr(gr.single.av)+'">'+b+'</div></div>';
      return;
    }
    var body='<div class="tpl-theme" data-ze="'+code+'|qa|'+k+'|'+gr.items[0].idx+'|q" data-cur="'+escAttr(gr.theme)+'">'+escHtml(gr.theme)+'</div>';
    gr.items.forEach(function(it){
      var b2='';
      if(it.qbody) b2+='<div class="tpl-q">'+escHtml(it.qbody)+'</div>';
      b2+='<div class="tpl-ans">'+tplHoles(it.av,it.holes)+'</div>';
      body+='<div class="tpl-sub">'+(it.kw?'<div class="tpl-kw">'+escHtml(it.kw)+'</div>':'')+'<div class="tpl-body" data-ze="'+code+'|qa|'+k+'|'+it.idx+'|a" data-cur="'+escAttr(it.av)+'">'+b2+'</div></div>';
    });
    html+='<div class="tpl-row" onclick="tplOpen(this)">'+body+'</div>';
  });
  document.getElementById('main-content').innerHTML=html;
  window.__tpl={code:code,key:k};
  window.__zr=function(){ showTplTable(code,k); };
  document.querySelectorAll('.scratch').forEach(function(el){
    el.onclick=function(){ this.classList.add('revealed'); };
  });
}

function showQAGroup(code,k,mod,typeFilter,zxType){
  if(!typeFilter&&code==='15044'&&(k==='主观题汇总'||k==='主观题带背')){ showQA44Table(code,k,mod); return; }
  if(!typeFilter&&code==='15043'&&k==='万能答题模板'){ showTplTable(code,k); return; }
  if(code==='13000'&&k==='主观题汇总密训'){ setActive(mod||'qa'); document.getElementById('main-content').innerHTML='<div style="color:#767676;padding:20px">该资料已并入「短文写作」专区，请前往 短文写作 板块查看</div>'; return; }
  setActive(mod||'qa');
  const s=DATA[code];
  const g=s.qa[k];
  if(!g){ document.getElementById('main-content').innerHTML='<div style="color:#767676;padding:20px">暂无资料</div>'; return; }
  document.getElementById('tb-crumb').textContent='首页 / '+s.name+' / '+(g.head||k);
  document.getElementById('tb-title').textContent=s.name+' · '+(g.head||k);
  let backTarget="showOverview('"+code+"')";
  if(mod==='prediction') backTarget="showPrediction('"+code+"')";
  if(mod==='practice') backTarget="showPractice('"+code+"')";
  if(mod==='zx'&&zxType) backTarget="showZxType('"+code+"','"+zxType+"')";
  // 专项训练按题型过滤：typeFilter='essay' 只留论述，'short' 只留简答（header 章节分隔始终保留）
  var itemsAll=(g.items||[]);
  var shown=[];
  if(typeFilter==='essay'||typeFilter==='short'){
    for(var zi=0;zi<itemsAll.length;zi++){
      var zit=itemsAll[zi];
      if(!zit) continue;
      if(zit.header){ shown.push({it:zit,i:zi}); }
      else if((typeFilter==='essay')===zxQaIsEssay(code,k,zi)){ shown.push({it:zit,i:zi}); }
    }
  } else {
    for(var zi2=0;zi2<itemsAll.length;zi2++){ if(itemsAll[zi2]) shown.push({it:itemsAll[zi2],i:zi2}); }
  }
  var shownQ=0; for(var zj=0;zj<shown.length;zj++){ if(!shown[zj].it.header) shownQ++; }
  if(code==='13000'&&k==='考点合集'){
    let html='<span class="back2" onclick="'+backTarget+'">← 返回</span>';
    html+=kdRenderKaoDian(g);
    document.getElementById('main-content').innerHTML=html;
    window.__zr=function(){ showQAGroup(code,k,mod); };
    if(code==='13000'){ document.body.classList.add('eng-word-mode'); document.body.classList.remove('eng-exam-mode'); bindEngTranslate(); }
    else { document.body.classList.remove('eng-word-mode'); }
    return;
  }
  let html='<span class="back2" onclick="'+backTarget+'">← 返回</span>';
  html+=resumeBar(code,'qagroup',k+'_'+(mod||'')+'_'+(typeFilter||''),"resumeJumpQAGroup('"+code+"','"+k+"','"+(mod||'')+"','"+(typeFilter||'')+"','"+(zxType||'')+"',__N__)",g.head||k);
  html+='<div style="font-size:17px;font-weight:700;margin:4px 0 8px">'+(g.head||k)+'（'+shownQ+'条）</div>';
  var qiCount=0;
  window.__qaGrp={code:code,key:k+'_'+(mod||'')+'_'+(typeFilter||''),label:g.head||k};
  shown.forEach(function(entry){
    var it=entry.it;
    var i=entry.i;
    var qv=ZP_or(ZP_get(code,'qa',k,i,'q',null),it.q);
    var av=ZP_or(ZP_get(code,'qa',k,i,'a',null),it.a);
    if(it.header){ html+='<div class="qa-sec" style="font-size:15px;font-weight:700;color:#b5482e;margin:16px 0 6px;border-left:3px solid #b5482e;padding-left:8px">'+it.header+'</div>'; return; }
    qiCount++;
    html+='<div class="qa-card" id="qa-'+k.replace(/\W/g,'')+'-'+i+'"><div class="qa-q" data-ze="'+code+'|qa|'+k+'|'+i+'|q|" data-cur="'+escAttr(qv)+'" onclick="qagOpen(this)">'+((/^\d+\./.test(qv))?'':(qiCount+'. '))+pgref(qv)+'</div><div class="qa-a" data-ze="'+code+'|qa|'+k+'|'+i+'|a|" data-cur="'+escAttr(av)+'">'+(code==='13000'?colorPointsQA(av||''):colorPoints(splitPointsZh(av||'')))+'</div></div>';
  });
  document.getElementById('main-content').innerHTML=html;
  window.__zr=function(){ showQAGroup(code,k,mod); };
  if(code==='13000'){ document.body.classList.add('eng-word-mode'); document.body.classList.remove('eng-exam-mode'); bindEngTranslate(); }
  else { document.body.classList.remove('eng-word-mode'); document.body.classList.remove('eng-exam-mode'); }

function getHiProg(setKey){ try{ var o=JSON.parse(localStorage.getItem(HI_PROG_KEY)||'{}'); return o[setKey]||{}; }catch(e){ return {}; } }

function parseHiSet(setKey){
  if(setKey==='话题词汇'){
    var qaI=(DATA['13000'].qa['决胜3小时']&&DATA['13000'].qa['决胜3小时'].items)||[];
    var body=qaI[0]?String(qaI[0].a):'';
    var out=[];
    String(body).split(/\r?\n/).forEach(function(ln){
      ln=ln.trim(); if(!ln) return;
      var m=ln.match(/^\d+\.\s+([A-Za-z][A-Za-z0-9 \-'\.\+\,\/\(\)]*?)\s+([\u4e00-\u9fa5].+)$/);
      if(m) out.push({w:m[1].trim(), p:'', m:m[2].trim()});
    });
    return out;
  }
  var s=DATA['13000'];
  var raw=(s.blanks&&s.blanks[setKey]&&s.blanks[setKey].content)||'';
  var arr=[];
  if(setKey==='词组表'){
    String(raw).split(/\r?\n/).forEach(function(ln){
      ln=ln.trim(); if(!ln) return;
      var m=ln.match(/^([A-Za-z][A-Za-z\- ]+?)\s+([\u4e00-\u9fa5].+)$/);
      if(m) arr.push({w:m[1].trim(), p:'', m:m[2].trim()});
    });
  } else {
    var seen={};
    var body=String(raw);
    var hpos=body.indexOf('\n高频词汇\n');
    if(hpos>=0) body=body.slice(hpos+6);
    var lines=body.split(/\r?\n/); var i=0;
    while(i<lines.length){
      var ln=lines[i].trim();
      var m=ln.match(/^\d+\.\s+([A-Za-z][A-Za-z'\-]*)\s*(\[[^\]]+\])?/);
      if(m){
        var w=m[1], pho=m[2]||'', def='';
        var j=i+1;
        while(j<lines.length){
          var dl=lines[j].trim();
          if(/^\d+\.\s+[A-Za-z]/.test(dl)) break;
          if(/^(n|v|vt|vi|adj|adv|prep|conj|pron|art|num|aux|int)\.?\s/.test(dl)){ def=dl; break; }
          if(/^[A-Za-z]/.test(dl)){ def=dl; break; }
          j++;
        }
        if(!seen[w]){ seen[w]=1; arr.push({w:w,p:pho,m:def}); }
        i=j+1;
      } else { i++; }
    }
  }
  return arr;
}

function grmPara(t){
  var lines=String(t).split('\n');
  var out=[]; var cur=null; var afterArrow=false; var afterTitle=false;
  for(var i=0;i<lines.length;i++){
    var ln=lines[i].trim();
    if(!ln) continue;
    var isStart=/^[（(]\d+[)）]/.test(ln)||/^\d+[.、．]/.test(ln)||/^[①②③④⑤⑥⑦⑧⑨⑩]/.test(ln)||/^[A-Za-z]/.test(ln)||/^[（(][一二三四五六七八九十]/.test(ln);
    if(cur===null){ cur={t:ln}; out.push(cur); afterArrow=/^→/.test(ln); afterTitle=/^\d+[.、．]/.test(ln); continue; }
    if(/^→/.test(ln)){ cur={t:ln}; out.push(cur); afterArrow=true; afterTitle=false; continue; }
    if(/^\d+[.、．]/.test(ln)){ cur={t:ln}; out.push(cur); afterArrow=false; afterTitle=true; continue; }
    if((afterArrow||afterTitle) && !isStart){ cur={t:ln}; out.push(cur); afterArrow=false; afterTitle=false; continue; }
    if(isStart){ cur={t:ln}; out.push(cur); afterArrow=false; afterTitle=false; }
    else { cur.t+=ln; afterArrow=false; afterTitle=false; }
  }
  return out.map(function(p){return p.t;});
}

function grmNoteHtmlV3(t){
  var ps=grmPara(t);
  var h=''; var buf=[];
  function fb(){ if(buf.length){ h+='<div class="grm-note">'+escHtml(buf.join('\n')).replace(/\n/g,'<br>')+'</div>'; buf=[]; } }
  for(var i=0;i<ps.length;i++){
    var p=ps[i];
    if(/^\d+[.、．]/.test(p)){ fb(); h+='<div class="grm-subh-b">'+escHtml(p)+'</div>'; }
    else if(/^[（(]\d+[)）]/.test(p)){ fb(); h+='<div class="grm-subh">'+escHtml(p)+'</div>'; }
    else { buf.push(p); }
  }
  fb();
  return h;
}

function grmTableHtml(head, rows){
  var jzCol=-1;
  for(var i=0;i<head.length;i++){ if(/助记/.test(String(head[i]))){ jzCol=i; break; } }
  var C=head.length, R=rows.length;
  var span=[];
  for(var c=0;c<C;c++){
    span[c]=new Array(R);
    var i=0;
    while(i<R){
      var v=(rows[i][c]!==undefined?String(rows[i][c]):'').trim();
      if(!v){ span[c][i]=1; i++; continue; }
      var j=i+1;
      while(j<R){
        var w=(rows[j][c]!==undefined?String(rows[j][c]):'').trim();
        if(w===v){ j++; continue; }
        if(!w){ j++; continue; }
        break;
      }
      var n=j-i;
      span[c][i]=n;
      for(var k=i+1;k<j;k++) span[c][k]=0;
      i=j;
    }
  }
  var h='<div class="grm-tbl-wrap"><table class="grm-table"><thead><tr>';
  for(var i2=0;i2<head.length;i2++){ h+='<th>'+escHtml(String(head[i2]||''))+'</th>'; }
  h+='</tr></thead><tbody>';
  for(var r=0;r<R;r++){
    var rowHtml=''; var hasCell=false;
    for(var k=0;k<C;k++){
      if(span[k][r]===0){ continue; }
      hasCell=true;
      var v=rows[r][k]!==undefined?String(rows[r][k]):'';
      var cls=(k===jzCol)?' class="grm-jz"':'';
      var rs=span[k][r]>1?(' rowspan="'+span[k][r]+'"'):'';
      rowHtml+='<td'+cls+rs+'>'+escHtml(v).replace(/\n/g,'<br>')+'</td>';
    }
    if(hasCell){ h+='<tr>'+rowHtml+'</tr>'; }
  }
  h+='</tbody></table></div>';
  return h;
}

function showBlankMatch(code){
  var s=DATA[code];
  if(!s){ ZK_load(['data_'+code+'.js'], function(){ showBlankMatch(code); }); return; }
  var skip={};
  ['重点词汇默写','做题方法与技巧','应试技巧（新题型）','自考英语二课后题答案（教材课后练习参考答案）'].forEach(function(k){ skip[k]=1; });
  if(code==='15043'){ ['考前60分','密押选择题考点100题','模块汇总资料','填空题高频考点','第一章填空题'].forEach(function(k){ skip[k]=1; }); }
  var items=[];
  function bmExtract(it){
    if(!it||typeof it!=='object') return null;
    if(Array.isArray(it.parts)){
      var qs=[],as=[];
      (it.parts||[]).forEach(function(p){
        if(!p||typeof p!=='object') return;
        var t=String(p.t||'').replace(/\s+/g,' ').trim();
        var g=String(p.g||'').replace(/\s+/g,' ').trim();
        if(t){ qs.push(g?t+'（____）':t); }
        if(g) as.push(g);
      });
      var q2=qs.join('；'), a2=as.join('；');
      var ans=String(it.ans||'').replace(/\s+/g,' ').trim();
      if(q2&&(a2||ans)) return {q:q2,a:ans||a2};
      return null;
    }
    var q=String(it.q||it.t||'').replace(/\s+/g,' ').trim();
    var a=String(it.a||it.ans||'').replace(/\s+/g,' ').trim();
    return (q&&a)?{q:q,a:a}:null;
  }
  Object.keys(s.blanks||{}).forEach(function(k){
    if(skip[k]) return;
    var v=s.blanks[k];
    if(!v||typeof v!=='object'||v.type==='raw') return;
    var arr=Array.isArray(v)?v:(v.items||[]);
    (arr||[]).forEach(function(it){
      var ex=bmExtract(it);
      if(ex) items.push(ex);
    });
  });
  if(!items.length){ showBlanks(code); return; }
  window.__fcData=items;
  showFlipMatch(code,'考点消消乐',items);
}



function isWordTableContent(t){
  var lines=String(t||'').split('\n');
  var hasHead=false, posCount=0;
  lines.forEach(function(ln){
    if(ln.indexOf('单词')>=0 && ln.indexOf('刷')>=0) hasHead=true;
    if(/^(?:v|n|adj|adv|prep|conj|pron|num|art|int|aux|vt|vi|modal|phr)\b\./.test(ln.trim())) posCount++;
  });
  return hasHead && posCount>=10;
}
function buildWordTableRows(content){
  var lines=String(content||'').split('\n').map(function(x){return x.trim();});
  var rows=[], cur=null;
  lines.forEach(function(ln){
    if(!ln) return;
    if(ln.indexOf('单词')>=0 && ln.indexOf('刷')>=0) return;
    var mm=ln.match(/^(?:v|n|adj|adv|prep|conj|pron|num|art|int|aux|vt|vi|modal|phr)\b\./);
    if(mm){
      var posList=[], defParts=[], last=0;
      var re=/(?:v|n|adj|adv|prep|conj|pron|num|art|int|aux|vt|vi|modal|phr)\b\./g;
      var m;
      while((m=re.exec(ln))){
        posList.push(m[0]);
        defParts.push(ln.slice(last,m.index));
        last=m.index+m[0].length;
      }
      defParts.push(ln.slice(last));
      var pos=posList.join(' ');
      var def=defParts.join('').trim();
      if(cur){ cur.pos=(cur.pos?cur.pos+' ':'')+pos; cur.def=(cur.def?cur.def+' ':'')+def; }
      return;
    }
    cur={word:ln,pos:'',def:''};
    rows.push(cur);
  });
  return rows;
}
function renderWordTable(content){
  var rows=buildWordTableRows(content);
  var h='<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:15px;line-height:1.7">';
  h+='<thead><tr style="background:#3a5a40;color:#fff"><th style="padding:9px 12px;text-align:left">单词</th><th style="padding:9px 12px;text-align:left;width:110px">词性</th><th style="padding:9px 12px;text-align:left">释义</th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    var bg=(i%2)?'#f4f7f2':'#fff';
    h+='<tr style="background:'+bg+'"><td style="padding:8px 12px;font-weight:700">'+escHtml(r.word)+'</td>';
    h+='<td style="padding:8px 12px">'+(r.pos?'<span class="pos-velcro" onclick="this.classList.toggle(\'ov\')">'+escHtml(r.pos)+'</span>':'')+'</td>';
    h+='<td style="padding:8px 12px">'+escHtml(r.def).replace(/\n/g,'<br>')+'</td></tr>';

  h+='</tbody></table></div>';
  return h;
}

function splitSections(txt){
  var parts=[],pos=0;
  while(true){
    var si=txt.indexOf('【',pos);
    if(si<0){ var tail=txt.slice(pos).trim(); if(tail) parts.push({h:'',body:tail}); break; }
    var ei=txt.indexOf('】',si);
    if(ei<0){ var tail2=txt.slice(pos).trim(); if(tail2) parts.push({h:'',body:tail2}); break; }
    if(si>pos){ var pre=txt.slice(pos,si).trim(); if(pre) parts.push({h:'',body:pre}); }
    var h=txt.slice(si+1,ei).trim();
    pos=ei+1;
    var nxt=txt.indexOf('【',pos);
    var body=(nxt<0?txt.slice(pos):txt.slice(pos,nxt)).trim();
    parts.push({h:h,body:body});
    if(nxt<0) break;
    pos=nxt;
  }
  return parts;
}

function autoBlank(txt){
  var re=/((?:18|19|20)\d{2}年)|(《[^《》]{1,24}》)|([「『“][^」』”]{1,20}[」』”])|(?:是|为|即|叫做|称为|又称)([^，。；、：（）]{2,8})(?=[，。；、）])/g;
  var out='', last=0, m, cnt=0;
  re.lastIndex=0;
  while((m=re.exec(txt))!==null){
    if(cnt>=3) break;
    var val=m[4]?m[4]:m[0];
    var gap=m[4]?(m[0].length-m[4].length):0;
    out+=txt.substring(last,m.index+gap);
    out+='<span class="scratch">'+val+'</span>';
    last=m.index+gap+val.length; cnt++;
  }
  out+=txt.substring(last);
  return out;
}

    while((m=splitRe.exec(v))!==null){
      var before=v.substring(last,m.index);
      if(before){ cur+=before; }
      flush();
      if(m[0]!=='\n'){ cur+='<span class="blank-mark">'+m[0]+'</span>'; }
      last=m.index+m[0].length;
    }
    if(last<v.length){ cur+=v.substring(last); }
  });
  flush();
  var out='';
  if(lines.length===0){ lines.push(''); }
  if(qno!==''){ lines[0]='<span class="blank-num">'+qno+'.</span>'+lines[0]; }
  lines.forEach(function(ln,i){
    var txt=ln.replace(/<[^>]*>/g,'').replace(/^\s+/,'');
    var cls='blank-line';
    if(mode==='ks30'){
      if(/^[①②③④⑤⑥⑦⑧⑨⑩]\s*[^，。；、：（）的了是出现具有为在能对缺乏来\n]{1,14}$/.test(txt)&&ln.indexOf('scratch')<0){
        cls+=' blank-zh';
        ln=ln.replace(/^<span class="blank-mark">[①②③④⑤⑥⑦⑧⑨⑩]<\/span>\s*/,'');
      }
      else if(/^(知识点|考点)\s*\d+[：:]/.test(txt)){ cls+=' blank-kp'; }
      else if(/^[0-9一二三四五六七八九十]+）/.test(txt)){ cls+=' indent-1'; }
      else if(/^\([0-9]{1,3}\)/.test(txt)){ cls+=' indent-1'; }
    } else if(mode==='kp3'){
      if(/^(知识点|考点)\s*\d+[：:]/.test(txt)){ cls+=' blank-kp'; }
      else if(/^[0-9一二三四五六七八九十]+）/.test(txt)){ cls+=' indent-2'; }
      else if(/^[①②③④⑤⑥⑦⑧⑨⑩]/.test(txt)){ cls+=' indent-4'; }
    } else {
      if(/^(知识点|考点)\s*\d+[：:]/.test(txt)){ cls+=' blank-kp'; }
      else if(/^[0-9一二三四五六七八九十]+）/.test(txt)){ cls+=' indent-1'; }
      else if(/^\([0-9]{1,3}\)/.test(txt)){ cls+=' indent-1'; }
      else if(/^[①②③④⑤⑥⑦⑧⑨⑩]/.test(txt)){ cls+=' indent-2'; }
    }
    out+='<div class="'+cls+'">'+ln+'</div>';
  });
  return out;
}

/* ===== 真题收藏：⭐ 手动收藏键（localStorage 持久化，按科目独立收藏夹） ===== */
var ZK_FAV_KEY='zk_fav';
function favGet(code){ try{ var o=JSON.parse(localStorage.getItem(ZK_FAV_KEY)||'{}'); return (o[code]||[]).slice(); }catch(e){ return []; } }
function favSave(code,arr){ try{ var o=JSON.parse(localStorage.getItem(ZK_FAV_KEY)||'{}'); o[code]=arr; localStorage.setItem(ZK_FAV_KEY,JSON.stringify(o)); }catch(e){} }
function favHas(id){ var p=id.split('|'); return favGet(p[0]).indexOf(id)>=0; }
function favToggle(id,btn){
  var p=id.split('|'); var arr=favGet(p[0]);
  var i=arr.indexOf(id); var on;
  if(i>=0){ arr.splice(i,1); on=false; } else { arr.unshift(id); on=true; }
  favSave(p[0],arr);
  if(btn){ btn.innerHTML=on?'★':'☆'; btn.setAttribute('data-on',on?'1':'0'); btn.title=on?'取消收藏':'收藏本题'; }
  updateFavCount();
  return on;
}
function goFavBook(){
  if(curSubj && DATA[curSubj]){ showFav(curSubj); }
  else { alert('请先进入某个科目，再查看该科目的收藏夹'); }
}
function updateFavCount(){
  var el=document.getElementById('fav-count');
  if(!el) return;
  var n=0;
  if(curSubj && DATA[curSubj]){ n=favGet(curSubj).length; }
  else { try{ var o=JSON.parse(localStorage.getItem(ZK_FAV_KEY)||'{}'); for(var k in o){ n+=(o[k]||[]).length; } }catch(e){} }
  el.textContent=n;
}
function favBtnHTML(id){

  return '<button class="fav-btn" data-on="'+(on?'1':'0')+'" title="'+(on?'取消收藏':'收藏本题')+'" onclick="favToggle(\''+id+'\',this)">'+(on?'★':'☆')+'</button>';

/* 挖空背诵条目「知识卡」：渲染完成后按「考点/章/节标题 + 块内内容」匹配现有卡库，命中则在标题行右侧追加按钮（笔记汇总/思维导图等图形形态豁免） */
function kpInjectBlank(code,k){
  if(code==='13000') return;
  if(k==='笔记汇总'||k==='思维导图') return;
  var box=document.getElementById('main-content');
  if(!box) return;
  if(!window.__kpCards||!window.__kpCards[code]){
    if(window.__kpLoadingBlank===code) return;
    window.__kpLoadingBlank=code;
    ZK_load(['data_knowledge_'+code+'.js'], function(){ window.__kpLoadingBlank=''; kpInjectBlank(code,k); });
    return;
  }
  function isHead(n){ return n.classList&&(n.classList.contains('kt-subhd')||n.classList.contains('blank-kdhead')||n.classList.contains('blank-sec')||n.classList.contains('kt-sec-hd')); }
  /* 只认「考点N」类标题行（kt-subhd 需匹配"考点N"；blank-kdhead 数据本身即考点N 格式）。章/节标题一律不挂。 */
  function isKdHead(n){
    if(!n||!n.classList) return false;
    if(n.classList.contains('blank-kdhead')) return true;
    if(n.classList.contains('kt-subhd')){ return /^(考点|知识点)\s*\d+[：:]?/.test(String(n.getAttribute('data-cur')||n.textContent||'')); }
    return false;
  }
  var heads=[].slice.call(box.querySelectorAll('.kt-subhd,.blank-kdhead')).filter(isKdHead);
  /* 板块没有任何考点N 标题（如密押填空、高频2604 按章平铺）时回退条目级：一题一卡，不重复 */
  if(heads.length===0){
    box.querySelectorAll('.blank-card,.kd-item').forEach(function(el){
      if(!el||el.querySelector('.kp-btn')) return;
      var full=String(el.getAttribute('data-cur')||el.textContent||'').replace(/^\s*\d+\.\s*/,'').trim();
      if(!full) return;
      if(!findKpCard(code,full,[])) return;
      var b=document.createElement('button');
      b.className='kp-btn kp-btn-head';
      b.title='本题知识卡（AI汇编 · 基于公开史实）';
      b.textContent='知识卡';
      b.onclick=function(){ kpCardRender(code,full); };
      el.appendChild(b);
    });
    return;
  }
  heads.forEach(function(h){
    if(!h||h.classList.contains('kt-plain')||h.querySelector('.kp-btn')) return;
    var txt=String(h.getAttribute('data-cur')||h.textContent||'').replace(/^\s*\d+\.\s*/,'').trim();
    var n=h.nextElementSibling, guard=0;
    while(n&&guard<300){
      if(isHead(n)) break;
      if(n.classList.contains('kd-item')||n.classList.contains('blank-card')||n.classList.contains('kd-body')||n.classList.contains('kt-sec-body')){ txt+=' '+n.textContent; }
      n=n.nextElementSibling; guard++;
    }
    if(!findKpCard(code,txt,[])) return;
    var b=document.createElement('button');
    b.className='kp-btn kp-btn-head';
    b.title='本题知识卡（AI汇编 · 基于公开史实）';
    b.textContent='知识卡';
    b.onclick=function(e){ if(e&&e.stopPropagation) e.stopPropagation(); kpCardRender(code,txt); };
    h.appendChild(b);
  });
}
/* 每道题专属「知识卡」：故事化叙述 + 知识点小结（AI汇编，基于公开史实，不虚构） */
function kpBtnHTML(){
  return curSubj==='13000'?'':'<button class="kp-btn" title="本题知识卡（AI汇编 · 基于公开史实）" onclick="showKpCard(this)">知识卡</button>';
}
function showKpCard(btn){
  var card=btn.closest('.q-card')||btn.parentNode;
  var qel=card.querySelector('.q-text');
  var qtxt=qel?(qel.textContent||'').replace(/^\s*\d+\.\s*/,''):'';
  var code=curSubj;
  if(!window.__kpCards||!window.__kpCards[code]){
    ZK_load(['data_knowledge_'+code+'.js'], function(){ kpCardRender(code,qtxt); });
    return;
  }
  kpCardRender(code,qtxt);
}
function findKpCard(code,qtxt,kws){
  var arr=(window.__kpCards&&window.__kpCards[code])||[];
  var best=null,bestScore=0;
  arr.forEach(function(c){
    if(!c) return;
    var keys=[c.key].concat(c.keys||[]);
    var sc=0;
    keys.forEach(function(kk){
      if(!kk) return;
      if(qtxt.indexOf(kk)>=0) sc+=3;
      if(kws){ kws.forEach(function(k){ if(k&&(kk.indexOf(k)>=0||k.indexOf(kk)>=0)) sc+=1; }); }
    });
    if(sc>bestScore){ bestScore=sc; best=c; }
  });
  return bestScore>0?best:null;
}
function kpCardRender(code,qtxt){
  var kws=kpExtractKeywords(qtxt);
  var card=findKpCard(code,qtxt,kws);
  function bold(t){ return String(t||'').replace(/\*\*([^*]+)\*\*/g,'<b style="color:#8a5a1f">$1</b>'); }

    +'<div class="kp-head">🧠 知识卡 · <span class="kp-title-sub" style="font-size:12px;color:#767676;font-weight:400">AI汇编 · 基于公开史实，如有出入以教材为准</span>'
    +'<span class="kp-close" onclick="closeKp()">✕</span></div>'
    +'<div class="kp-body">';
  if(!card){
    html+='<div style="color:#767676;padding:10px 0">本题暂无专属知识卡。</div>';
  } else {
    if(card.title) html+='<div style="font-size:16px;font-weight:700;color:#b5482e;margin:2px 0 10px">'+escHtml(card.title)+'</div>';
    html+='<div style="background:#fbf7ee;border:1px solid #eee3cf;border-radius:10px;padding:12px 14px">';

    });

    if(card.points&&card.points.length){
      html+='<div style="margin:14px 0 8px;padding-left:10px;border-left:4px solid #d8a24a;font-size:14px;font-weight:700;color:#b5482e">💡 知识点小总结</div>';
      card.points.forEach(function(p,i){
        html+='<div style="margin:6px 0;line-height:1.75;font-size:13.5px;color:#3a3128;padding-left:24px;text-indent:-24px"><span style="display:inline-block;min-width:22px;font-weight:700;color:#b5482e">'+(i+1)+'.</span>'+bold(escHtml(p))+'</div>';

  }
  html+='</div></div></div>';

/* 收藏夹选择题：点选项重新作答，判对错并高亮（不影响原卷答题记录） */
function favPick(id,i,btn){

    const type=sec.type||'choice';
    const scoreTxt=type==='essay'?'（'+(sec.score||30)+'分）':'（'+(sec.score||1)+'分）';
    (sec.items||[]).forEach(function(item,idx){
      qno++;
      const id=qid(curSubj,curSet,'S'+secIdx,idx);
      const card=document.createElement('div');
      card.className='q-card';

        choiceQues.push({id:id,qnoNum:qno,card:card,item:item,sec:sec});
        // 英语真题选择题：去掉"显示答案"按钮（选对变绿/选错变红即反馈），⭐ 收藏保留
        const actBtn='<div class="q-actions">'+(isEng?'':'<button class="action-btn" onclick="revealChoice(this,\''+id+'\')">显示答案</button>')+favBtnHTML(id)+kpBtnHTML()+'</div>';

        const ow=card.querySelector('.opts');
        item.opts.forEach(function(op,i){
          const b=document.createElement('button');
          b.className='opt';
          b.innerHTML='<span class="lab">'+LTRS[i]+'</span><span>'+op+'</span>';
          b.onclick=function(){

            ow.querySelectorAll('.opt').forEach(function(ob,oi){

        card.innerHTML='<div class="q-text" style="display:flex;align-items:baseline"><span class="qn">'+qno+'.</span><span class="qscore">'+scoreTxt+'</span></div>'

      } else {

      }
      box.appendChild(card);
    });
  });
  if(choiceQues.length>0) buildAnswerBar(box,choiceQues,sections,{code:curSubj,mod:'sets',key:curSet,label:curSet});
}

var EXAM_CLZ={};
function examClozeRender(q,no,id,a){
  EXAM_CLZ[id]={no:no,a:a};
  var re=new RegExp('(?:__'+no+'__|_{2,}\\('+no+'\\)|(?<![A-Za-z0-9_])'+no+'(?=\\s*\\())(?:\\s*\\(([^)]*)\\))?');
  if(!re.test(q)) return q;
  return q.replace(re,function(m,stem){
    var stemTxt=stem?stem.trim():'';
    return '<span class="ec-wrap" data-id="'+id+'">'
      +'<span style="color:#b5482e;font-weight:700">'+no+'.</span>'
      +'<input data-id="'+id+'" style="width:86px;border:none;border-bottom:1.5px solid #b5482e;border-radius:0;padding:0 4px;font-size:14px;color:#333;outline:none;background:transparent;text-align:center" onkeydown="if(event.key===\'Enter\')examClozeSubmit(this)" onblur="examClozeBlur(this)"/>'
      +(stemTxt?'<span style="color:#767676;font-weight:400;font-size:12px">（'+escHtml(stemTxt)+'）</span>':'')
      +'</span>';
  });
}
function examClozeSubmit(inp){
  var id=inp.getAttribute('data-id');
  var info=EXAM_CLZ[id]; if(!info) return;
  var v=inp.value.trim();
  var ok=v.toLowerCase()===String(info.a).toLowerCase();
  answers[id]=v;
  var stem='';
  var wrap=inp.parentNode;
  var stemEl=wrap.querySelector('span:last-child');
  if(stemEl&&stemEl.textContent.indexOf('（')>=0) stem=stemEl.textContent;
  wrap.innerHTML='<span style="color:'+(ok?'#2d6a4f':'#9d2b2b')+';font-weight:700">'+info.no+'.'+(ok?'':'✗ ')+'<span style="color:#e8960c">'+escHtml(info.a)+'</span></span>'+(stem?'<span style="color:#767676;font-weight:400;font-size:12px">'+escHtml(stem)+'</span>':'');
  updateAnswerBar();
}
function examClozeBlur(inp){
  if(inp.value.trim()) examClozeSubmit(inp);
}

/* ===== 英语翻译功能（点词翻译 + 段落翻译，仅英语真题模式启用）===== */
var ENG_DICT=null;
function buildEngDict(){
  if(ENG_DICT) return ENG_DICT;
  ENG_DICT={};
  try{
    var d=DATA['13000']&&DATA['13000'].blanks;
    if(!d) return ENG_DICT;
    // 1) 大纲词汇：来自背单词板块 vocab（word+音标+释义）
    var v=DATA['13000']&&DATA['13000'].vocab;
    if(v&&v.length){
      v.forEach(function(o){
        if(!o||!o.w) return;
        ENG_DICT[String(o.w).toLowerCase()]={w:o.w,pho:o.p||'',def:o.m||''};
      });
    }
    // 2) 词组表：phrase 中文释义（两个以上空格分隔）
    var phr=d['词组表'];
    if(phr&&phr.content){
      String(phr.content).split(/\r?\n/).forEach(function(line){
        line=line.trim();
        if(!line) return;
        // 词组格式：phrase 中文释义（中间空格分隔，释义以中文开头）
        var m=line.match(/^([A-Za-z][A-Za-z\- ]*?)[\s]+([\u4e00-\u9fa5].+)$/);
        if(m){
          var k=m[1].trim().toLowerCase();
          if(!ENG_DICT[k]) ENG_DICT[k]={w:m[1].trim(),pho:'',def:m[2].trim()};
        }
      });
    }
  }catch(e){ console.log('dict build error',e); }
  return ENG_DICT;
}
function lookupEngWord(txt){
  var dict=buildEngDict();
  var hfv=(typeof HFV_EXTRA!=='undefined')?HFV_EXTRA:{};
  var extra=(typeof ECDICT_EXTRA!=='undefined')?ECDICT_EXTRA:{};
  var k=String(txt).trim().toLowerCase().replace(/[^a-z'\- ]/g,'');
  if(!k) return null;
  if(dict[k]) return dict[k];
  if(hfv[k]) return hfv[k];
  if(extra[k]) return extra[k];
  // 词形变化兜底：ing/ed/es/s/ies（大纲/HFV/ECDICT 都查）
  var base=null;
  if(k.length>3){
    if(k.slice(-3)==='ing'&&(dict[k.slice(0,-3)]||hfv[k.slice(0,-3)]||extra[k.slice(0,-3)])) base=k.slice(0,-3);
    else if(k.slice(-3)==='ing'&&(dict[k.slice(0,-3)+'e']||hfv[k.slice(0,-3)+'e']||extra[k.slice(0,-3)+'e'])) base=k.slice(0,-3)+'e';
    else if(k.slice(-1)==='s'&&(dict[k.slice(0,-1)]||hfv[k.slice(0,-1)]||extra[k.slice(0,-1)])) base=k.slice(0,-1);
    else if(k.slice(-2)==='es'&&(dict[k.slice(0,-2)]||hfv[k.slice(0,-2)]||extra[k.slice(0,-2)])) base=k.slice(0,-2);
    else if(k.slice(-3)==='ies'&&(dict[k.slice(0,-3)+'y']||hfv[k.slice(0,-3)+'y']||extra[k.slice(0,-3)+'y'])) base=k.slice(0,-3)+'y';
    else if(k.slice(-2)==='ed'&&(dict[k.slice(0,-2)]||hfv[k.slice(0,-2)]||extra[k.slice(0,-2)])) base=k.slice(0,-2);
    else if(k.slice(-2)==='ed'&&(dict[k.slice(0,-1)]||hfv[k.slice(0,-1)]||extra[k.slice(0,-1)])) base=k.slice(0,-1);
  }
  if(base){
    var e=dict[base]||hfv[base]||extra[base];
    if(e){ var c={w:base,pho:e.pho||'',pos:e.pos||'',def:e.def||''}; return c; }
  }
  return null;
}
function wordFromEvent(e){
  try{
    var rng=document.caretRangeFromPoint?document.caretRangeFromPoint(e.clientX,e.clientY):null;
    if(rng&&rng.startContainer&&rng.startContainer.nodeType===3){
      var node=rng.startContainer, text=node.textContent||'', off=rng.startOffset;
      var re=/[A-Za-z][A-Za-z'\-]*/g, m;
      while((m=re.exec(text))!==null){
        if(off>=m.index&&off<=m.index+m[0].length) return m[0];
      }
    }
  }catch(err){}
  return null;
}

function getVocab(){ try{ var a=JSON.parse(localStorage.getItem('engVocab')||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }

  else{ a.push(w); }

function speakWordMeSpeak(w,accent){

    var vs=ENG_VOICES||speechSynthesis.getVoices();
    var u=new SpeechSynthesisUtterance(String(w));

        ||vs.find(function(x){return x.lang&&x.lang.toLowerCase().indexOf('en')===0;});
    }
    if(v) u.voice=v;
    try{ speechSynthesis.cancel(); }catch(e){}
    try{ speechSynthesis.resume(); }catch(e){}
    u.onerror=function(){ showSpeakHint(w); };
    speechSynthesis.speak(u);
    if(!v) setTimeout(function(){ showSpeakHint(w); }, 400);
  };
  var trySpeak=function(){
    try{
      if(MESPEAK_READY||(typeof meSpeak!=='undefined'&&meSpeak.isConfigLoaded&&meSpeak.isConfigLoaded()&&(meSpeak.isVoiceLoaded('en/en-us')||meSpeak.isVoiceLoaded('en/en-rp')))){
        try{ meSpeak.resetQueue(); }catch(e){}
        try{ meSpeak.speak(String(w),{voice:(accent==='en-GB')?'en/en-rp':'en/en-us',speed:110,volume:100}); }catch(e){}
        return true;
      }
    }catch(e){}
    return false;
  };
  try{
    if(trySpeak()) return;
    if(!ZK_SPEAK_TRYING){
      ZK_SPEAK_TRYING=true;
      ZK_load(['mespeak.js','mespeak_config.js','voice_en_us.js','voice_en_rp.js'], function(){
        ZK_SPEAK_TRYING=false;
        if(!trySpeak()){ try{ sysFallback(); }catch(e){ showSpeakHint(w); } }
      });

    }
    try{ sysFallback(); }catch(e){ showSpeakHint(w); }
  }catch(e){ showSpeakHint(w); }
}
function speakWord(w,accent){
  var txt=String(w);
  var done=false;
  var fb=function(){ if(!done){ done=true; speakWordMeSpeak(txt,accent); } };
  // 1) 有道在线真人发音（美音 type=2 / 英音 type=1），失败回退离线 meSpeak
  try{
    if(engAudio){ try{ engAudio.pause(); }catch(e){} engAudio=null; }
    var a=new Audio('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(txt)+'&type='+((accent==='en-GB')?1:2));
    engAudio=a;
    var fallbackTimer=null;
    a.onerror=fb;
    a.oncanplay=function(){ if(fallbackTimer){ clearTimeout(fallbackTimer); fallbackTimer=null; } };
    // 2.5s 仍无数据（网络/环境异常）→ 回退离线 meSpeak
    fallbackTimer=setTimeout(function(){
      if(!done&&a&&a.readyState===0){ fallbackTimer=null; fb(); }
    }, 2500);
    var p=a.play();
    if(p&&p.catch) p.catch(function(){ if(!done&&a&&a.readyState===0) fb(); });

  }catch(e){}

}

/* 单块翻译：Google 优先（3s 超时），MyMemory 兜底 */
async function translateBlock(text){
  var out='';
  try{
    var ctrl1=new AbortController(); var t1=setTimeout(function(){ctrl1.abort();},1200);
    var u1='https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q='+encodeURIComponent(text);
    var r1=await fetch(u1,{signal:ctrl1.signal}); clearTimeout(t1);
    var j1=await r1.json();
    if(j1&&j1[0]) out=j1[0].map(function(seg){return seg?seg[0]:''}).join('');
  }catch(e1){}
  if(!out){
    try{
      var u2='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,480))+'&langpair=en|zh-CN';
      var r2=await fetch(u2); var j2=await r2.json();
      if(j2&&j2.responseData&&j2.responseData.translatedText) out=j2.responseData.translatedText;
    }catch(e2){}
  }
  return out;
}
/* 长文本分段翻译：按句子边界切成 ≤450 字符块，逐块翻译拼接 */
async function translateChunked(text){
  var src=String(text||'').trim();
  if(!src) return '';
  if(src.length<=480) return translateBlock(src);
  // 按句子边界切块
  var parts=[], cur='';
  src.split(/(?<=[.!?])\s+/).forEach(function(seg){
    if(!seg) return;
    if(cur.length+seg.length>480){
      if(cur) parts.push(cur.trim());
      // 单句超长则硬切
      while(seg.length>480){ parts.push(seg.slice(0,480)); seg=seg.slice(480); }
      cur=seg;
    } else cur+=' '+seg;
  });
  if(cur) parts.push(cur.trim());
  var outs=[];
  for(var i=0;i<parts.length;i+=3){
    var batch=parts.slice(i,i+3).map(function(p){ return translateBlock(p); });
    var rs=await Promise.all(batch);
    outs=outs.concat(rs);
  }
  return outs.filter(function(x){return x&&x.trim();}).join('\n');
}

function onQuizScroll(fromUser){

  if(!abState||!abState.ques.length) return;
  const barEl=document.getElementById('answer-bar');
  const barH=barEl?barEl.offsetHeight:0;
  let cur=0, found=false;
  abState.ques.forEach(function(q,idx){
    if(found) return;
    const el=q.card;
    if(!el) return;
    const r=el.getBoundingClientRect();
    // 视口内答题卡下方第一道题 = 当前正在看的题
    if(r.top>=barH){ cur=idx; found=true; }
  });
  if(!found) cur=abState.ques.length-1; // 全部滚过，取最后一道
  if(cur!==abState.curIdx){
    abState.curIdx=cur; updateAnswerBar();
    // 仅真实滚动/布局变化才记录位置（跳转联动不记录，避免重渲染误覆盖）
    if(fromUser&&abState.__resume){ var rm=abState.__resume; resumeSave(rm.code,rm.mod,rm.key,cur+1,abState.ques.length,rm.label); }

  window.addEventListener('scroll',function(){ onQuizScroll(true); });
  if(window.__abObserver){
    try{ window.__abObserver.disconnect(); }catch(e){}
  }
  const io=new IntersectionObserver(function(){
    onQuizScroll(true);
  },{rootMargin:'0px 0px -20% 0px',threshold:0});
  window.__abObserver=io;
  abState.ques.forEach(function(q,idx){

var __kpPool={};
function buildKpPool(code){
  if(__kpPool[code]) return __kpPool[code];
  var s=DATA[code];
  var pool=[];
  function push(src,title,text){
    var t=String(text||'').replace(/\s+/g,' ').trim();
    if(t.length>=4) pool.push({src:src,title:title,text:t});
  }
  var bk=s.blanks||{};
  for(var k in bk){
    var arr=bk[k];
    if(!Array.isArray(arr)) continue;
    arr.forEach(function(it,i){
      if(it&&it.parts){
        var txt='';
        it.parts.forEach(function(p){
          if(!p) return;
          if(p.t) txt+=p.t;
          if(p.g) txt+=' '+p.g;
        });
        if(txt.replace(/\s/g,'').length>=8) push(k,(it.header||('条目'+(i+1))),txt);
      }
      if(it&&it.q){ push(k,(it.header||('条目'+(i+1))),it.q+(it.a?'\n'+it.a:'')); }
    });
  }
  var qk=s.qa||{};
  for(var k2 in qk){
    var qarr=qk[k2];
    if(!qarr||!qarr.items) continue;
    qarr.items.forEach(function(it,i){
      if(it&&it.q) push(k2,'第'+(i+1)+'条',it.q+(it.a?'\n'+it.a:''));
    });
  }
  __kpPool[code]=pool;
  return pool;
}
var __kpStopWords='的 了 是 在 与 和 其 或 对 从 到 于 及 为 被 把 让 使 中 上 下 内 外 等 也 都 就 而 但 且 并 又 再 先 后 由 向 以 之 所 这 那 它 他 她 我 你 我们 他们 我国 中国 世界 简述 论述 简答 简析 试述 试论 为什么 怎样 如何 怎么 什么 哪些 哪个 何人 何时 何处 指出 说明 谈谈 分析 归纳 总结 概括 列举 主要 内容 意义 原因 特点 性质 作用 影响 关系 区别 联系 下列 关于 属于 包括 以及 时期 历史 社会 阶段 基本 重要 之一 提出 认为 主张 反映 表明 体现 决定 标志 开始 结束 完成 实行 建立 成立 产生 发展 坚持 反对 提倡 要求 需要 可以 应该 具有 成为 进行 发生 存在 出现 形成 进入 达到 取得 实现 经过 通过 根据 按照 依照 对于 至于 所谓'.split(' ');
function kpExtractKeywords(q){
  var t=String(q||'');
  t=t.replace(/[^\u4e00-\u9fa50-9]/g,' ');
  var parts=t.split(/\s+/).filter(function(x){return x.length>=2;});
  var out=[],seen={};
  function addKw(k,w){
    if(seen[k]||__kpStopWords.indexOf(k)>=0||__kpSubBlock.indexOf(k)>=0) return;
    seen[k]=1;
    out.push({k:k,w:w});
  }
  parts.forEach(function(p){
    if(p.length<=14){
      addKw(p,p.length<=4?3:(p.length<=7?2:1));
    } else {
      // 长句：滑动 2-3 字窗口提取专有名词
      for(var i=0;i<p.length-1;i++){
        addKw(p.slice(i,i+2),1);
        if(i<p.length-2) addKw(p.slice(i,i+3),2);
      }
    }
  });
  out.sort(function(a,b){ return b.w-a.w; });
  return out.slice(0,6).map(function(o){ return o.k; });
}
var __kpSubBlock='中国 社会 历史 世界 革命 时期 阶段 基本 重要 主要 内容 意义 原因 特点 关于 属于 包括 以及 提出 认为 主张 建立 成立 发展 开始 进行 发生 存在 形成 实现 取得 通过 根据 具有 成为 之间 之后 以前 以后 上述 下列 国家 人民 群众 阶级 民族 政府 制度 政策 方针 路线 思想 理论 原则 方式 方法 过程 结果 目标 任务 条件 基础 前提 核心 关键 根本 本质 实质 目的 影响 作用 地位 性质 表现 特征 方面 层次 领域 范围 情况 问题 战争 侵略 斗争 起义 运动 改革 变法 条约 会议 大会 报告 精神 建设 现代 近代 当代 古代 世纪 年代 时期'.split(' ');
function kpKwHits(text,kw){
  if(text.indexOf(kw)>=0) return 2;
  if(kw.length>=5){
    // 长词拆子串放宽召回（如"鸦片战争前"→ 鸦片/战争/前；"中国社会的性质"→ 社会性质）
    var subs=[kw.slice(0,2),kw.slice(0,3),kw.slice(-2),kw.slice(-3)];
    var hit=0;
    for(var s=0;s<subs.length;s++){
      var sb=subs[s];
      if(sb.length<2||__kpSubBlock.indexOf(sb)>=0) continue;
      if(text.indexOf(sb)>=0) hit++;
    }
    return hit>0?1:0;
  }
  return 0;
}
function kpSearch(code,q){
  var pool=buildKpPool(code);
  var kws=kpExtractKeywords(q);
  if(!kws.length) return [];
  // 稀有度重排：资料中出现条目越少的词越独特（专有名词优先，用于命中定位）
  kws.sort(function(a,b){
    var ca=0,cb=0;
    for(var p=0;p<pool.length;p++){
      if(pool[p].text.indexOf(a)>=0) ca++;
      if(pool[p].text.indexOf(b)>=0) cb++;
    }
    return ca-cb;
  });
  var scored=[];
  pool.forEach(function(it,i){
    var hits=0;
    kws.forEach(function(kw){ hits+=kpKwHits(it.text,kw); });
    if(hits>0) scored.push({idx:i,hits:hits,it:it});
  });
  scored.sort(function(a,b){ return b.hits-a.hits; });
  return scored.slice(0,3).map(function(o){
    var it=o.it;
    var pos=-1;
    for(var j=0;j<kws.length;j++){ pos=it.text.indexOf(kws[j]); if(pos>=0) break; }
    var seg='';
    if(pos>=0){
      var start=Math.max(0,pos-45), end=Math.min(it.text.length,pos+80);
      seg=(start>0?'…':'')+it.text.slice(start,end)+(end<it.text.length?'…':'');
    } else seg=it.text.slice(0,120);
    return {src:it.src,title:it.title,seg:seg,text:it.text};
  });
}
function findKpStory(code,qtxt,kws){
  var arr=(window.__kpStory&&window.__kpStory[code])||[];
  for(var i=0;i<arr.length;i++){
    var s=arr[i];
    if(!s||!s.key) continue;
    var keys=[s.key].concat(s.keys||[]);
    for(var j=0;j<keys.length;j++){
      var kk=keys[j];
      if(!kk) continue;
      if(qtxt.indexOf(kk)>=0) return s;
      if(kws&&kws.length){
        for(var m=0;m<kws.length;m++){
          var k=kws[m];
          if(k&&(kk.indexOf(k)>=0||k.indexOf(kk)>=0)) return s;
        }
      }
    }
  }
  return null;
}

function ansShow(item,opts){
  var raw=(item&&item.a!=null)?item.a:'';
  var L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var rawS=String(raw);
  if(opts&&Array.isArray(opts)&&opts.length){
    var out=[];
    if(/^\d+$/.test(rawS)){
      rawS.split('').forEach(function(d){
        var i=parseInt(d,10);
        if(i>=0&&i<opts.length) out.push(L[i]+'. '+opts[i]);
      });
    } else {
      rawS.split('').forEach(function(ch){
        var i=L.indexOf(ch);
        if(i>=0&&i<opts.length) out.push(ch+'. '+opts[i]);
      });
    }
    return out.join('\n')||rawS;
  }
  if(/^\d+$/.test(rawS)){
    return rawS.split('').map(function(d){ return L[parseInt(d,10)]; }).join('');
  }
  return rawS;
}
